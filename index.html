  bindCards();
}

function bindCards(){
  grid.querySelectorAll('.card').forEach(card=>{
    const id = card.dataset.id;
    card.addEventListener('mouseenter', ()=>{
      coverPlayerCancelHide();
      if (THEME[id] && THEME[id].bvid) card.classList.add('hovering');
      coverPlayerScheduleShow(id, card);     // 悬停 → 封面换成主题曲视频
    });
    card.addEventListener('mouseleave', ()=>{
      card.classList.remove('hovering');
      coverPlayerScheduleHide();             // 移开 → 收走视频，海报淡回来
    });
    card.addEventListener('click', ()=> { location.hash = '#/a/' + id; });
  });
}

/* ---------- 子页面（同文件内路由 #/a/<id>） ---------- */
const homeEl = document.getElementById('home');
const pageEl = document.getElementById('subpage');
const modalAudio = new Audio();
modalAudio.volume = 0.9;
let current = null, currentSongIdx = 0;

/* ---------- 主题曲列表：长按拖动排序 ----------
   排序结果存在 localStorage（key 用 src 序列，比下标稳，曲目增删也不会错位）。
   顺序一变 songs[0] 就变 —— 而卡片 / 滚动带悬停试听取的正是 songs[0]，
   所以清掉 previews 缓存后，滚动带的试听自然跟着换。 */
const ORDER_KEY = 'cm-song-order-v1';
function readOrderMap(){
  try {
    const o = JSON.parse(localStorage.getItem(ORDER_KEY) || '{}');
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  } catch (e) { return {}; }
}
function writeOrderMap(o){ try { localStorage.setItem(ORDER_KEY, JSON.stringify(o)); } catch (e) {} }

/* 页面一加载就把存过的顺序应用上：首页卡片显示的曲名也要跟着对 */
(function applyStoredOrder(){
  const map = readOrderMap();
  DATA.forEach(d => {
    const want = map[d.id];
    if (!Array.isArray(want) || want.length !== d.songs.length) return;
    if (new Set(want).size !== want.length) return;
    const bySrc = new Map(d.songs.map(s => [s.src, s]));
    const re = want.map(src => bySrc.get(src));
    if (re.every(Boolean)) d.songs = re;
  });
})();

let plSuppressClick = false;
let plTimer = null, plDragging = false, plDragEl = null, plGhost = null;
let plStartX = 0, plStartY = 0, plOffsetY = 0;

function resetPreviews(){
  Object.keys(previews).forEach(k => { try { previews[k].pause(); } catch (e) {} delete previews[k]; });
}

function syncPlaylistActive(){
  const pl = document.getElementById('playlist');
  pl.querySelectorAll('.playlist-item').forEach((el, idx) =>
    el.classList.toggle('active', idx === currentSongIdx && !!current));
}

/* ---------- 顶部 3D 海报轮播 ----------
   轮播铺满整宽，视口按 20% / 60% / 20% 分三段：中间那张居中且尺寸不打折，
   左右两张各自落在两侧 20% 带里，三张高度都撑满轮播高度。
   左右两张向内侧倾斜 —— 左卡的左边缘、右卡的右边缘一起往屏幕里退，
   形成「中间凸、两侧向内凹」的立体展台（左右互为镜像）。
   自动缓慢翻页；鼠标停在海报上就停住；两侧圆形按钮可手动翻。 */
let cfIdx = 0, cfTimer = null, cfHover = false, cfCards = [];

/* 底衬：把这部动画的全部真实封面横向等分铺满整条 hero，每张透明度 0.4 */
function renderHeroBg(d){
  const bg = document.getElementById('spHeroBg');
  const ps = d.posters || [];
  bg.innerHTML = ps.map(p => `<i style="background-image:url('${p}')"></i>`).join('');
}

function renderCoverflow(d){
  const inner = document.getElementById('cfInner');
  const ps = d.posters || [];
  inner.innerHTML = ps.map((p, i) =>
    `<div class="cf-card" data-i="${i}"><img src="${p}" alt="${d.title} 海报 ${i + 1}" loading="lazy"></div>`
  ).join('');
  cfCards = [...inner.querySelectorAll('.cf-card')];
  cfCards.forEach(el => el.addEventListener('click', () => {
    const i = +el.dataset.i;
    if (i !== cfIdx){ cfGo(i); cfRestartAuto(); }
  }));
  cfIdx = 0;
  paintCoverflow();
  cfRestartAuto();
}

function paintCoverflow(){
  const n = cfCards.length;
  if (!n) return;
  cfCards.forEach((el, i) => {
    let rel = i - cfIdx;                  // 环形排列，首尾相接
    if (rel > n / 2) rel -= n;
    if (rel < -n / 2) rel += n;
    el.className = 'cf-card' + (rel === 0 ? ' is-cur'
      : rel === -1 ? ' is-l' : rel === 1 ? ' is-r' : ' is-off');
  });
}

function cfGo(i){
  const n = cfCards.length;
  if (!n) return;
  cfIdx = ((i % n) + n) % n;
  paintCoverflow();
}

function cfStopAuto(){ if (cfTimer){ clearInterval(cfTimer); cfTimer = null; } }

function cfRestartAuto(){
  cfStopAuto();
  if (cfCards.length < 2) return;
  cfTimer = setInterval(() => {
    if (cfHover || !pageEl.classList.contains('open')) return;   // 悬停 / 离开子页面时不翻
    cfGo(cfIdx + 1);
  }, 3400);
}

document.getElementById('cfPrev').addEventListener('click', () => { cfGo(cfIdx - 1); cfRestartAuto(); });
document.getElementById('cfNext').addEventListener('click', () => { cfGo(cfIdx + 1); cfRestartAuto(); });
const cfWrapEl = document.getElementById('cfWrap');
cfWrapEl.addEventListener('pointerenter', () => { cfHover = true; });
cfWrapEl.addEventListener('pointerleave', () => { cfHover = false; });

function renderPlaylist(d){
  const pl = document.getElementById('playlist');
  pl.innerHTML = d.songs.map((s, i) =>
    `<div class="playlist-item" data-i="${i}">
       <div class="pl-row">
         <span><i class="fas fa-music"></i> ${s.name}</span><span>${s.artist || ''}</span>
       </div>
       <div class="pl-progress" data-i="${i}">
         <span class="pl-track"><span class="pl-fill"></span><span class="pl-knob"></span></span>
         <span class="pl-time">0:00 / --:--</span>
       </div>
     </div>`).join('');
  pl.querySelectorAll('.playlist-item').forEach(el =>
    el.addEventListener('click', () => {
      if (plSuppressClick) return;             // 刚拖完那一下，别当成点击
      playSong(+el.dataset.i);
    }));
  syncPlaylistActive();
  resetBars();
}

/* ---------- 主题曲进度条（每条都能点、能拖） ----------
   全站只有一个 modalAudio 实例，所以分两种情况：
   · 拖的是「正在播的那首」→ 直接 seek；
   · 拖的是「别的曲子」→ 先切到那首，再落到目标位置。注意 src 刚换掉时
     duration 还是 NaN，这时赋 currentTime 会被直接丢掉，所以用 pendingSeek 兜着，
     等 loadedmetadata 拿到时长再补上。 */
let plBarDrag = null, pendingSeek = null;

const fmtTime = t => {
  if (!isFinite(t) || t < 0) return '--:--';
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
};

const barEl = i => document.querySelector(`#playlist .pl-progress[data-i="${i}"]`);

function paintBar(i, frac, cur, dur){
  const el = barEl(i);
  if (!el) return;
  const pct = Math.max(0, Math.min(1, frac)) * 100;
  el.querySelector('.pl-fill').style.width = pct + '%';
  el.querySelector('.pl-knob').style.left = pct + '%';
  el.querySelector('.pl-time').textContent = fmtTime(cur) + ' / ' + fmtTime(dur);
}

function resetBars(){
  document.querySelectorAll('#playlist .pl-progress').forEach(el => {
    el.querySelector('.pl-fill').style.width = '0%';
    el.querySelector('.pl-knob').style.left = '0%';
    el.querySelector('.pl-time').textContent = '0:00 / --:--';
  });
}

function seekFrac(frac){
  const dur = modalAudio.duration;
  if (isFinite(dur) && dur > 0){
    modalAudio.currentTime = Math.min(Math.max(frac, 0), 0.999) * dur;
    return true;
  }
  return false;                                  // 时长还没就绪 → 交给 pendingSeek
}

function fracFromX(track, x){
  const r = track.getBoundingClientRect();
  return r.width ? Math.min(Math.max((x - r.left) / r.width, 0), 1) : 0;
}

function applyBarDrag(){
  const { i, track, x } = plBarDrag;
  const f = fracFromX(track, x);
  plBarDrag.frac = f;
  if (!seekFrac(f)) pendingSeek = f;
  const dur = modalAudio.duration;
  paintBar(i, f, (isFinite(dur) && dur > 0) ? f * dur : 0, dur);
}

function endBarDrag(){
  if (!plBarDrag) return;
  if (!seekFrac(plBarDrag.frac)) pendingSeek = plBarDrag.frac;
  plBarDrag.bar.classList.remove('dragging');
  plBarDrag = null;
  plSuppressClick = true;                        // 拖完那一下别当成「点条目切歌」
  setTimeout(() => { plSuppressClick = false; }, 350);
}

document.getElementById('playlist').addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const bar = e.target.closest('.pl-progress');
  if (!bar) return;
  e.preventDefault();
  const i = +bar.dataset.i;
  if (i !== currentSongIdx) playSong(i);         // 点到别的曲子 → 先切歌
  const track = bar.querySelector('.pl-track');
  plBarDrag = { i, bar, track, x: e.clientX, frac: 0 };
  bar.classList.add('dragging');
  try { bar.setPointerCapture(e.pointerId); } catch (_) {}
  applyBarDrag();
});

window.addEventListener('pointermove', e => {
  if (!plBarDrag) return;
  e.preventDefault();
  plBarDrag.x = e.clientX;
  applyBarDrag();
}, { passive: false });

window.addEventListener('pointerup', endBarDrag);
window.addEventListener('pointercancel', endBarDrag);

modalAudio.addEventListener('timeupdate', () => {
  if (!current || plBarDrag) return;             // 拖动中由手指驱动，别被回调抢回去
  const dur = modalAudio.duration;
  const f = (isFinite(dur) && dur > 0) ? modalAudio.currentTime / dur : 0;
  paintBar(currentSongIdx, f, modalAudio.currentTime, dur);
});

modalAudio.addEventListener('loadedmetadata', () => {
  if (pendingSeek != null){ seekFrac(pendingSeek); pendingSeek = null; }
  if (!current) return;
  const dur = modalAudio.duration;
  const f = (isFinite(dur) && dur > 0) ? modalAudio.currentTime / dur : 0;
  paintBar(currentSongIdx, f, modalAudio.currentTime, dur);
});

/* 拖动排序：监听绑一次就够（#playlist 容器本身不会被替换） */
const plEl = document.getElementById('playlist');

plEl.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  if (e.target.closest('.pl-progress')) return;   // 进度条归进度条自己处理，别启动排序
  const item = e.target.closest('.playlist-item');
  if (!item || plDragging) return;
  plStartX = e.clientX; plStartY = e.clientY;
  clearTimeout(plTimer);
  plTimer = setTimeout(() => beginSortDrag(item, e.clientY), 420);  // 长按 0.42s 才进入拖动
});

window.addEventListener('pointermove', e => {
  if (plDragging){
    e.preventDefault();
    plGhost.style.top = (e.clientY - plOffsetY) + 'px';
    // 指针越过谁的中线就插到谁前面（列表里留一个半透明占位跟着走）
    const before = [...plEl.querySelectorAll('.playlist-item:not(.placeholder)')]
      .find(el => e.clientY < el.getBoundingClientRect().top + el.offsetHeight / 2);
    if (before){ if (before.previousElementSibling !== plDragEl) plEl.insertBefore(plDragEl, before); }
    else if (plEl.lastElementChild !== plDragEl) plEl.appendChild(plDragEl);
    return;
  }
  // 还没到长按时就移动 → 说明是点击或滚动，取消计时
  if (plTimer && (Math.abs(e.clientX - plStartX) > 8 || Math.abs(e.clientY - plStartY) > 8))
    clearTimeout(plTimer);
}, { passive: false });

window.addEventListener('pointerup', endSortDrag);
window.addEventListener('pointercancel', endSortDrag);

function beginSortDrag(item, y){
  plTimer = null;
  plDragging = true;
  plDragEl = item;
  const r = item.getBoundingClientRect();
  plOffsetY = y - r.top;
  plGhost = item.cloneNode(true);
  plGhost.className = 'playlist-item pl-ghost';
  plGhost.style.left = r.left + 'px';
  plGhost.style.top = r.top + 'px';
  plGhost.style.width = r.width + 'px';
  document.body.appendChild(plGhost);
  item.classList.add('placeholder');
  document.body.classList.add('pl-dragging');
}

function endSortDrag(){
  clearTimeout(plTimer); plTimer = null;
  if (!plDragging) return;
  plDragging = false;
  document.body.classList.remove('pl-dragging');
  if (plGhost){ plGhost.remove(); plGhost = null; }
  if (!plDragEl) return;
  plDragEl.classList.remove('placeholder');

  const perm = [...plEl.querySelectorAll('.playlist-item')].map(el => +el.dataset.i);
  const d = current;
  if (d && !perm.every((v, i) => v === i)){
    // 正在播的那首记成对象引用，重排后重新定位，播放不中断
    const playing = (currentSongIdx >= 0 && currentSongIdx < d.songs.length)
                    ? d.songs[currentSongIdx] : null;
    const old = d.songs;
    d.songs = perm.map(i => old[i]);
    if (playing){ const ni = d.songs.indexOf(playing); if (ni >= 0) currentSongIdx = ni; }

    const map = readOrderMap();
    map[d.id] = d.songs.map(s => s.src);
    writeOrderMap(map);

    resetPreviews();   // songs[0] 换了，滚动带 / 卡片的试听缓存作废
    render();          // 卡片上的曲名与试听源同步更新
    if (d.songs.length > 1) tip('顺序已保存 · 首页滚动带试听也跟着换');
  }

  plSuppressClick = true;
  if (d) renderPlaylist(d);
  setTimeout(() => { plSuppressClick = false; }, 400);
  plDragEl = null;
}

/* autoplay 必须当成参数统一生成：B 站播放器只认第一个 autoplay，
   若拼接成 &autoplay=0&autoplay=1，它会取 0 → 不会自动播放（实测踩过）。 */
const embedUrl = (bvid, page, autoplay = 0) =>
  `https://player.bilibili.com/player.html?bvid=${bvid}&page=${page || 1}` +
  `&high_quality=1&danmaku=0&autoplay=${autoplay}`;

/* 视频区：多源时给一排切换按钮 */
function renderVideo(d){
  const st = STORY[d.id] || {};
  const vids = st.videos || [];
  const tabs = document.getElementById('spVtabs');
  const frame = document.getElementById('spVideo');
  const note = document.getElementById('spVnote');
  note.textContent = st.video_note || '';
  if (!vids.length){
    tabs.innerHTML = '';
    frame.removeAttribute('src');          // 不设 src 就不会发请求
    frame.style.display = 'none';
    note.textContent = '这部动画的视频源还在挑，先把主题曲和讲解放上来。';
    return;
  }
  frame.style.display = '';
  tabs.innerHTML = vids.map((v, i) =>
    `<button class="sp-vtab ${i === 0 ? 'active' : ''}" data-i="${i}">${v.label}</button>`).join('');
  const show = (i) => {
    frame.src = embedUrl(vids[i].bvid, vids[i].page);
    tabs.querySelectorAll('.sp-vtab').forEach((b, bi) => b.classList.toggle('active', bi === i));
  };
  tabs.querySelectorAll('.sp-vtab').forEach(b =>
    b.addEventListener('click', () => show(+b.dataset.i)));
  show(0);
}

function openAnime(id){
  const d = DATA.find(x => x.id === id);
  if (!d) return;
  current = d;
  coverPlayerStop();                       // 进子页面就停掉卡片封面里的视频
  stopPreview();                           // 滚动带上那条试听也停
  stopPreviews();
  Object.values(previews).forEach(a => a.pause());
  const st = STORY[id] || {};

  document.getElementById('crumb').textContent = `童年回忆 / ${d.title}`;
  renderHeroBg(d);                         // 底衬：真实封面 0.4 透明度横向等分平铺
  renderCoverflow(d);                      // 顶部整宽 3D 海报轮播
  document.getElementById('spTitle').textContent = d.title;
  document.getElementById('spLede').textContent = st.lede || d.desc;

  document.getElementById('spStory').innerHTML = (st.sections || []).map(s =>
    `<h3>${s.h}</h3>` + (s.ps || []).map(p => `<p>${p}</p>`).join('')).join('');

  renderVideo(d);

  // 主题曲播放列表（支持长按拖动排序）
  renderPlaylist(d);

  homeEl.style.display = 'none';
  pageEl.classList.add('open');
  mqViewOpen = true;
  window.scrollTo(0, 0);
  playSong(0);
}

function closeAnime(){
  if (!pageEl.classList.contains('open')) return;
  modalAudio.pause();
  cfStopAuto();                            // 离开子页面就别再空转轮播了
  mqViewOpen = false;
  const frame = document.getElementById('spVideo');
  if (frame) frame.removeAttribute('src');   // 离开子页面就停掉视频
  pageEl.classList.remove('open');
  homeEl.style.display = '';
}

/* 路由 */
function route(){
  const m = /^#\/a\/([\w-]+)$/.exec(location.hash || '');
  if (m && DATA.some(d => d.id === m[1])) openAnime(m[1]);
  else closeAnime();
}
window.addEventListener('hashchange', route);
document.getElementById('backBtn').addEventListener('click', () => { location.hash = '/'; });

function playSong(i){
  currentSongIdx = i;
  const s = current.songs[i];
  modalAudio.src = s.src;
  pendingSeek = null;              // 换曲目了，上一首没落地的 seek 作废
  document.getElementById('nowTitle').textContent = s.name;
  document.getElementById('nowArtist').textContent = s.artist || '';
  document.getElementById('playlist').querySelectorAll('.playlist-item').forEach((el,idx)=>
    el.classList.toggle('active', idx===i));
  resetBars();
  modalAudio.play().then(()=> setPlayIcon(true))
    .catch(()=>{ if(!audioUnlocked) tip('先点一下页面，浏览器才允许自动播放声音'); setPlayIcon(false); });
}

function setPlayIcon(playing){
  document.getElementById('playBtn').innerHTML =
    playing ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
}

document.getElementById('playBtn').addEventListener('click', ()=>{
  if(modalAudio.paused){ modalAudio.play(); setPlayIcon(true); }
  else { modalAudio.pause(); setPlayIcon(false); }
});
modalAudio.addEventListener('ended', ()=>{
  if(current && currentSongIdx < current.songs.length - 1) playSong(currentSongIdx + 1);
  else setPlayIcon(false);
});

/* ---------- 卡片悬停 → 视频直接顶替封面 ----------
   为什么用"销毁 iframe"来停止：
   实测 B 站外链播放器**不响应** postMessage（{command/type/cmd:'pause'} 全试过）、
   也不吃直接调内部 <video>.pause() —— 播放器会自己接管并立刻恢复。
   所以"鼠标移开停止"只能靠撤掉 iframe 的 src，这样 100% 静音，代价是下次悬停要重新加载。
   为了不显得卡，进入悬停后延迟 260ms 再真正加载；移开后再等 120ms 才撤，
   这样在卡片之间快速移动鼠标不会反复加载。
   全站只用一个 iframe 实例：悬停时把它 append 进那张卡片的封面里
   （DOM 搬家本来就会让 iframe 重载，而这里反正每次都要换 src，所以没额外代价）。 */
const hoverPlayer = document.getElementById('hoverPlayer');
const hoverFrame = document.getElementById('hoverFrame');
const hoverPark = document.getElementById('hoverPark');
let hoverTimer = null, hoverHideTimer = null, hoverWant = null, hoverShown = null;

function coverPlayerShow(id, cardEl){
  const tv = THEME[id];
  if (!tv || !tv.bvid) return;
  const cover = cardEl.querySelector('.cover');
  if (!cover) return;
  if (hoverPlayer.parentElement !== cover) cover.appendChild(hoverPlayer);
  const url = embedUrl(tv.bvid, tv.page || 1, 1);          // 悬停版：autoplay=1
  if (hoverFrame.getAttribute('src') !== url) hoverFrame.setAttribute('src', url);
  hoverShown = id;
  if (!audioUnlocked) tip('若视频没自动出声，先点一下页面任意处即可');
}

function coverPlayerStop(){
  if (hoverTimer){ clearTimeout(hoverTimer); hoverTimer = null; }
  if (hoverHideTimer){ clearTimeout(hoverHideTimer); hoverHideTimer = null; }
  hoverWant = null;
  hoverShown = null;
  hoverFrame.removeAttribute('src');                       // ← 唯一可靠的停止方式
  if (hoverPlayer.parentElement !== hoverPark) hoverPark.appendChild(hoverPlayer);
}

function coverPlayerScheduleShow(id, el){
  coverPlayerCancelHide();
  const tv = THEME[id];
  if (!tv || !tv.bvid){ coverPlayerStop(); return; }        // 这部没有视频源 → 直接停掉
  if (hoverShown === id) return;
  hoverWant = id;
  if (hoverTimer) clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => { hoverTimer = null; if (hoverWant === id) coverPlayerShow(id, el); }, 260);
}

function coverPlayerScheduleHide(){
  if (hoverHideTimer) clearTimeout(hoverHideTimer);
  hoverHideTimer = setTimeout(() => { hoverHideTimer = null; coverPlayerStop(); }, 120);
}
function coverPlayerCancelHide(){
  if (hoverHideTimer){ clearTimeout(hoverHideTimer); hoverHideTimer = null; }
}

/* ---------- 分类标签 ---------- */
tabsEl.innerHTML = GROUPS.map(g=>
  `<div class="tab ${g==='全部'?'active':''}" data-g="${g}">${g}</div>`).join('');
tabsEl.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    tabsEl.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    activeGroup = t.dataset.g;
    stopPreviews();
    stopPreview();                          // 滚动带上那条试听也停
    coverPlayerStop();                      // 换分类会重建卡片，先把视频收回来
    render();
  });
});

/* ---------- Hero 背景：10 条竖长条封面（各占 1/10 宽、高度占满） ---------- */
const STRIP_TITLES = ["黑猫警长","迪迦奥特曼","葫芦娃","猪猪侠","熊出没",
                      "喜羊羊与灰太狼","果宝特攻","赛尔号","开心超人","超级飞侠"];
document.getElementById('heroStrips').innerHTML = STRIP_TITLES.map(t => {
  const d = DATA.find(x => x.title === t);
  const img = d ? `<img src="${d.posters[0]}" alt="${t}">` : '';
  return `<div class="hero-strip" title="${t}">${img}</div>`;
}).join('');

/* ---------- Hero 滚动海报带（左→中→右，小→大→小） ---------- */
const marqueeEl = document.getElementById('marquee');
const mqTrack = document.getElementById('marqueeTrack');
const MQ_W = 170, MQ_GAP = 28, MQ_STEP = MQ_W + MQ_GAP;
const MQ_SPEED = 0.5;                    // px/帧 —— 慢慢滚
const MQ_COPIES = 2;                     // 两份拼接，实现无缝循环
let mqOffset = 0;
let mqDragging = false, mqDragStartX = 0, mqDragStartOffset = 0, mqDragMoved = 0;

mqTrack.innerHTML = Array.from({ length: MQ_COPIES }, () =>
  DATA.map(d => `<div class="mq-item" data-id="${d.id}">
      <img src="${d.posters[0]}" alt="${d.title}" loading="lazy">
      <span class="mq-name">${d.title}</span>
    </div>`).join('')).join('');
const mqItems = [...mqTrack.children];

function layoutMarquee(){
  const mid = window.innerWidth / 2;
  const span = Math.max(window.innerWidth * 0.58, 380);
  for (let i = 0; i < mqItems.length; i++){
    const cx = mqOffset + i * MQ_STEP + MQ_W / 2;
    const t = Math.min(1, Math.abs(cx - mid) / span);
    const s = 1.35 - 0.66 * t * t;       // 中间 1.35 倍 → 两端 0.69 倍
    const el = mqItems[i];
    el.style.transform = `scale(${s.toFixed(3)})`;
    el.style.zIndex = String(Math.round(s * 100));
    el.style.opacity = (0.5 + 0.5 * (1 - t)).toFixed(3);
  }
}

function wrapOffset(){
  const total = DATA.length * MQ_STEP;
  if (total <= 0) return;
  while (mqOffset <= -total) mqOffset += total;
  while (mqOffset > 0) mqOffset -= total;
}

function mqFrame(){
  if (!(mqHoverPaused || mqViewOpen || mqDragging)){
    mqOffset -= MQ_SPEED;
    wrapOffset();
  }
  mqTrack.style.transform = `translate3d(${mqOffset}px,0,0)`;
  layoutMarquee();
  requestAnimationFrame(mqFrame);
}

/* 鼠标左键按住拖动（pointer 事件同时兼容触屏） */
function dragStart(e){
  if (e.button !== undefined && e.button !== 0) return;   // 只响应左键
  mqDragging = true;
  mqDragMoved = 0;
  mqDragStartX = e.clientX;
  mqDragStartOffset = mqOffset;
  marqueeEl.classList.add('dragging');
  if (marqueeEl.setPointerCapture && e.pointerId !== undefined){
    try { marqueeEl.setPointerCapture(e.pointerId); } catch(_){}
  }
  // 这里**不要** preventDefault：取消 pointerdown 会让浏览器不再派发后续的
  // mouseenter/mouseleave（连 hover 试听都会失效）。改为用 CSS 挡掉选中和图片拖拽：
  // .hero-marquee{user-select:none} + .mq-item img{-webkit-user-drag:none}
}
function dragMove(e){
  if (!mqDragging) return;
  const dx = e.clientX - mqDragStartX;
  mqDragMoved = Math.max(mqDragMoved, Math.abs(dx));
  mqOffset = mqDragStartOffset + dx;
  wrapOffset();
}
function dragEnd(){
  if (!mqDragging) return;
  mqDragging = false;
  marqueeEl.classList.remove('dragging');
}
marqueeEl.addEventListener('pointerdown', dragStart);
window.addEventListener('pointermove', dragMove);
window.addEventListener('pointerup', dragEnd);
window.addEventListener('pointercancel', dragEnd);
window.addEventListener('blur', dragEnd);

/* 悬停滚动带：停滚 + 移到哪张就试听哪部动画的主打歌 */
marqueeEl.addEventListener('mouseenter', () => { mqHoverPaused = true; });
marqueeEl.addEventListener('mouseleave', () => { mqHoverPaused = false; stopPreview(); });

let mqPlayingId = null;
function playPreview(id, el){
  if (mqPlayingId === id) return;
  stopPreview();
  const d = DATA.find(x => x.id === id);
  if (!d || !d.songs.length) return;
  mqPlayingId = id;
  if (el) el.classList.add('playing');
  const a = preview(id);
  a.currentTime = 0;
  a.play().catch(() => {
    if (!audioUnlocked) tip('先点一下页面任意处，悬停试听才会出声');
  });
}
function stopPreview(){
  if (!mqPlayingId) return;
  const el = mqItems.find(x => x.dataset.id === mqPlayingId);
  if (el) el.classList.remove('playing');
  const a = previews[mqPlayingId];
  if (a){ a.pause(); a.currentTime = 0; }
  mqPlayingId = null;
}

mqItems.forEach(el => {
  const id = el.dataset.id;
  el.addEventListener('mouseenter', () => playPreview(id, el));
  el.addEventListener('mouseleave', () => { if (mqPlayingId === id) stopPreview(); });
});

/* 点击滚动带里的封面 → 进入那部动画的子页面。
   这里不用 click 事件：拖动逻辑在 pointerdown 阶段调了 preventDefault，
   而取消 pointerdown 会连带吞掉兼容的 mouse 事件序列，click 会时有时无。
   改成自己在 pointerup 里判定（位移 ≤ 8px 才算"点击"），点一下必进页面。
   注意：dragStart 里对滚动带做了 setPointerCapture，pointerup 会被**重定向**到滚动带本身，
   e.target 不再是那张封面 —— 所以先用 elementFromPoint 按坐标兜一次。 */
marqueeEl.addEventListener('pointerup', (e) => {
  const moved = mqDragMoved;
  mqDragMoved = 0;
  if (moved > 8) return;                          // 刚刚是在拖动，不算点击
  let el = e.target && e.target.closest ? e.target.closest('.mq-item') : null;
  if (!el){
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    el = hit && hit.closest ? hit.closest('.mq-item') : null;
  }
  if (!el) return;
  stopPreview();
  location.hash = '#/a/' + el.dataset.id;
});

mqOffset = -(DATA.length * MQ_STEP) / 2; // 从中间开始，左右都铺满
requestAnimationFrame(mqFrame);

render();
route();                                 // 支持直接带 #/a/p01 打开（刷新/分享链接）
window.__dbg = { DATA, STORY, THEME, previews, modalAudio, openAnime, closeAnime, route,
                 coverPlayer: { el: hoverPlayer, frame: hoverFrame,
                                parked: () => hoverPlayer.parentElement === hoverPark,
                                cardId: () => { const c = hoverPlayer.closest('.card');
                                                return c ? c.dataset.id : null; },
                                shown: () => hoverShown,
                                src: () => hoverFrame.getAttribute('src'),
                                stop: coverPlayerStop, show: coverPlayerShow },
                 marquee: { el: marqueeEl, track: mqTrack, items: mqItems,
                            offset: () => mqOffset, paused: () => mqHoverPaused || mqViewOpen,
                            dragging: () => mqDragging, moved: () => mqDragMoved,
                            playingId: () => mqPlayingId, stopPreview,
                            dragStart, dragMove, dragEnd },
                 strips: [...document.querySelectorAll('.hero-strip')] };
</script>
</body>
</html>
