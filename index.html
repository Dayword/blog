<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>童年回忆 · 动漫主题曲</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6B6B'/%3E%3Ccircle cx='11' cy='22' r='4' fill='white'/%3E%3Ccircle cx='23' cy='19' r='4' fill='white'/%3E%3Cpath d='M14 22V9l13-2v12' stroke='white' stroke-width='2.6' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f7fa;color:#243043}
.navbar{position:fixed;top:0;left:0;right:0;height:65px;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);box-shadow:0 2px 15px rgba(0,0,0,.08);z-index:1000;
  display:flex;align-items:center;justify-content:space-between;padding:0 42px}
.logo{font-size:24px;font-weight:800;display:flex;gap:10px;align-items:center;
  background:linear-gradient(135deg,#FF6B6B,#FFD93D,#6BCB77);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent}
.logo i{-webkit-text-fill-color:#FF6B6B}
.hero{position:relative;min-height:620px;padding:104px 0 34px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;overflow:hidden;background:#18203a}
/* 背景：10 条竖长条封面（每条占 1/10 宽，高度占满） */
.hero-strips{position:absolute;inset:0;display:flex;z-index:0}
.hero-strip{flex:0 0 10%;width:10%;overflow:hidden;position:relative;
  box-shadow:inset -1px 0 0 rgba(255,255,255,.10)}
.hero-strip img{width:100%;height:100%;object-fit:cover;display:block;
  -webkit-user-drag:none;user-select:none;opacity:.72;
  filter:saturate(1.1) brightness(1.02)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(180deg,rgba(16,22,44,.78) 0%,rgba(16,22,44,.38) 32%,
             rgba(16,22,44,.60) 58%,rgba(16,22,44,.90) 84%,rgba(18,24,46,1) 100%),
             radial-gradient(circle at 20% 18%,rgba(255,255,255,.18),transparent 45%),
             radial-gradient(circle at 80% 72%,rgba(255,217,61,.24),transparent 52%)}
.hero-content{position:relative;z-index:2;text-align:center;color:#fff;padding:0 20px}
/* 滚动海报带：左→中→右，小→大→小 */
.hero-marquee{position:relative;z-index:2;width:100%;overflow:hidden;cursor:grab;user-select:none;
  touch-action:pan-y;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%)}
.hero-marquee.dragging{cursor:grabbing}
.marquee-track{display:flex;align-items:center;gap:28px;padding:40px 0 26px;will-change:transform}
.mq-item{flex:0 0 auto;width:170px;position:relative;cursor:pointer;transform-origin:center center}
.mq-item img{width:170px;height:225px;object-fit:cover;border-radius:16px;display:block;
  box-shadow:0 16px 36px rgba(8,14,28,.42);background:#2b3350;
  -webkit-user-drag:none;user-select:none}
.mq-item::after{content:"";position:absolute;inset:0;border-radius:16px;
  background:linear-gradient(to top,rgba(8,14,28,.78),transparent 52%)}
.mq-name{position:absolute;left:6px;right:6px;bottom:9px;z-index:2;text-align:center;color:#fff;
  font-size:13px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.75);pointer-events:none}
.mq-item:hover img{box-shadow:0 18px 44px rgba(255,217,61,.55)}
/* 悬停试听中的那张：描一圈红边 + 名字前加个音符，让"在放歌"这件事看得见 */
.mq-item.playing img{box-shadow:0 18px 44px rgba(255,107,107,.6);
  outline:2px solid #FF6B6B;outline-offset:3px}
.mq-item.playing .mq-name::before{content:"♪ "}
.hero-title{font-size:clamp(38px,7vw,76px);font-weight:800;letter-spacing:4px;
  text-shadow:0 6px 30px rgba(0,0,0,.28)}
.hero-subtitle{font-size:clamp(15px,2.4vw,22px);margin-top:14px;opacity:.92}
.container{max-width:1480px;margin:0 auto;padding:46px 34px 90px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  margin-bottom:30px}
.tabs{display:flex;flex-wrap:wrap;gap:10px}
.tab{padding:9px 20px;border-radius:40px;background:#fff;color:#5b6879;cursor:pointer;
  font-size:14px;border:1px solid #e6ebf2;transition:.2s;user-select:none}
.tab:hover{border-color:#FF6B6B;color:#FF6B6B}
.tab.active{background:linear-gradient(135deg,#FF6B6B,#FF9F45);color:#fff;border-color:transparent;
  box-shadow:0 8px 20px rgba(255,107,107,.32)}
.count{font-size:13px;color:#8b98a9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:26px}
.card{background:#fff;border-radius:20px;overflow:hidden;cursor:pointer;position:relative;
  box-shadow:0 6px 24px rgba(20,40,80,.08);transition:transform .28s,box-shadow .28s;
  display:flex;flex-direction:column}
.card:hover{transform:translateY(-8px);box-shadow:0 20px 44px rgba(20,40,80,.18)}
.cover{position:relative;aspect-ratio:3/4;overflow:hidden;background:#eef2f7}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s,opacity .25s}
.card:hover .cover img{transform:scale(1.07)}
.cover-mask{position:absolute;inset:0;background:linear-gradient(to top,rgba(12,20,35,.82) 0%,
  rgba(12,20,35,.15) 45%,transparent 70%);opacity:.9}
.playing-flag{position:absolute;top:12px;left:12px;display:flex;gap:6px;align-items:center;
  background:rgba(255,107,107,.95);color:#fff;font-size:12px;padding:5px 11px;border-radius:30px;
  opacity:0;transform:translateY(-6px);transition:.22s}
.card.hovering .playing-flag{opacity:1;transform:none}
.playing-flag .bar{display:flex;gap:2px;align-items:flex-end;height:11px}
.playing-flag .bar i{width:3px;background:#fff;border-radius:2px;animation:eq .9s infinite ease-in-out}
.playing-flag .bar i:nth-child(2){animation-delay:.15s}
.playing-flag .bar i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{height:4px}50%{height:11px}}
.cover-title{position:absolute;left:14px;right:14px;bottom:12px;color:#fff}
.cover-title h3{font-size:17px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.cover-title span{font-size:12px;opacity:.85}
.card-body{padding:14px 16px 18px}
.card-desc{font-size:12.5px;line-height:1.65;color:#6c7a8d;min-height:62px}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.card-tag{font-size:11px;color:#7d6bd6;background:#f0eefc;padding:3px 9px;border-radius:20px}
.card-song{margin-top:12px;font-size:12px;color:#a3adbb;display:flex;gap:6px;align-items:center}
.footer{text-align:center;padding:34px;color:#9aa6b5;font-size:13px}
/* 子页面里复用的通用件：播放器 */
.player{background:linear-gradient(135deg,#fff5f5,#f7f4ff);border:1px solid #f0e6f5;
  border-radius:18px;padding:18px 20px;box-shadow:0 6px 24px rgba(20,40,80,.07)}
.player-row{display:flex;align-items:center;gap:16px}
.play-btn{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(135deg,#FF6B6B,#FF9F45);color:#fff;font-size:20px;
  box-shadow:0 10px 24px rgba(255,107,107,.42);transition:.2s}
.play-btn:hover{transform:scale(1.06)}
.now-title{font-size:15px;font-weight:700}
.now-artist{font-size:12.5px;color:#8b98a9;margin-top:3px}
.playlist{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.playlist-item{display:flex;flex-direction:column;gap:7px;
  font-size:13px;padding:11px 14px;border-radius:10px;background:#fff;cursor:pointer;
  border:1px solid #eef2f7;color:#5b6879}
.playlist-item:hover{border-color:#FF6B6B;color:#FF6B6B}
.playlist-item.active{background:#fff0f0;border-color:#FF6B6B;color:#FF6B6B;font-weight:700}
.pl-row{display:flex;justify-content:space-between;gap:10px;align-items:center}
/* 每条主题曲自己的进度条：点一下跳到该处，按住可左右拖 */
.pl-progress{display:flex;align-items:center;gap:10px;touch-action:none;cursor:pointer}
.pl-track{position:relative;flex:1;height:5px;border-radius:99px;background:#eef2f7}
.playlist-item.active .pl-track{background:#ffe1e1}
.pl-fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#FF6B6B,#FF9F45)}
.pl-progress.dragging .pl-fill{transition:none}
.pl-knob{position:absolute;top:50%;left:0;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
  border-radius:50%;background:#fff;border:2px solid #FF6B6B;
  box-shadow:0 1px 4px rgba(255,107,107,.45);transform:scale(.65);transition:transform .15s}
.playlist-item:hover .pl-knob,.playlist-item.active .pl-knob,
.pl-progress.dragging .pl-knob{transform:scale(1)}
.pl-time{flex:0 0 auto;min-width:78px;text-align:right;font-size:11.5px;
  color:#8b98a9;font-variant-numeric:tabular-nums}
.playlist-item.active .pl-time{color:#ff8a8a}
/* 主题曲列表：长按拖动排序 */
.playlist-item{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.playlist-item.placeholder{opacity:.3}
body.pl-dragging{cursor:grabbing}
.pl-ghost{position:fixed;z-index:1200;pointer-events:none;border-radius:10px;
  padding:11px 14px;background:#fff;border:1px solid #FF6B6B;
  color:#FF6B6B;font-weight:700;box-shadow:0 16px 36px rgba(24,34,52,.24)}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:rgba(24,34,52,.94);
  color:#fff;font-size:13.5px;padding:12px 22px;border-radius:40px;z-index:3000;opacity:0;
  pointer-events:none;transition:.3s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
/* ---------- 卡片悬停时：视频直接顶替封面 ----------
   竖版封面框（3:4）里嵌 16:9 视频，上下必然留空 → 用海报自身的模糊放大版垫底，
   这样不会出现生硬的黑色横条。鼠标移开后视频立刻收走，海报淡回来。 */
.cover-blur{position:absolute;inset:-10%;background-size:cover;background-position:center;
  filter:blur(20px) saturate(1.15) brightness(.62);opacity:0;transition:opacity .25s}
.cover-player{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  aspect-ratio:16/9;background:#000;opacity:0;pointer-events:none;transition:opacity .22s}
.cover-player iframe{width:100%;height:100%;border:0;display:block}
.card.hovering .cover-blur{opacity:1}
.card.hovering .cover-mask{opacity:0}
.card.hovering .cover img{opacity:0;transform:none}
.card.hovering .cover-player{opacity:1;pointer-events:auto}
/* ---------- 子页面（同文件内路由） ---------- */
.page{display:none;padding-top:65px;min-height:100vh;background:#f5f7fa}
.page.open{display:block}
.page-bar{position:sticky;top:65px;z-index:60;background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);border-bottom:1px solid #e9eef5;
  display:flex;align-items:center;gap:14px;padding:12px 34px}
.page-back{display:inline-flex;align-items:center;gap:8px;border:1px solid #e6ebf2;background:#fff;
  color:#5b6879;font-size:14px;padding:8px 16px;border-radius:30px;cursor:pointer;transition:.2s;
  font-family:inherit}
.page-back:hover{border-color:#FF6B6B;color:#FF6B6B}
.page-crumb{font-size:13px;color:#9aa6b5}
.page-inner{max-width:1080px;margin:0 auto;padding:26px 34px 80px}

/* 顶部：名称 + 简介在上，整宽 3D 海报轮播在下。
   底衬是这部动画自己的真实封面 —— N 张封面把整条背景等分成 N 份，
   每份铺一张、透明度 0.4，再压一层渐变遮罩保证白字可读。 */
.sp-hero{position:relative;border-radius:24px;overflow:hidden;background:#0b1120}
.sp-hero-bg{position:absolute;inset:0;display:flex}
.sp-hero-bg i{display:block;flex:1 1 0;min-width:0;opacity:.4;
  background-size:cover;background-position:center center;background-repeat:no-repeat}
.sp-hero-mask{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(8,13,26,.62) 0%,rgba(8,13,26,.32) 46%,rgba(8,13,26,.74) 100%)}
.sp-hero-main{position:relative;z-index:2;width:100%;padding:30px 34px 42px;
  display:flex;flex-direction:column;gap:30px}
/* 3D 海报轮播：铺满整宽，宽度按 20% / 60% / 20% 分配（正好 100%）。
   轮播自身用 `aspect-ratio:5/4` 定高 —— 中间卡（宽 = 轮播宽的 60%、保持 3/4 竖版）
   的高 0.6W·4/3 = 0.8W = 轮播高，既不出框也不留白。
   左右两张各占 20% 宽（= 中间卡宽 × 1/3，用 `scale(.333)` 实现，纯 transform 不触发布局），
   各自落在两侧 20% 带的正中，并向内侧倾斜（左卡左缘、右卡右缘一起往屏幕里凹，互为镜像）。 */
.cf-wrap{position:relative;width:100%;aspect-ratio:5/4;overflow:hidden;perspective:2200px}
.cf-inner{position:absolute;inset:0}
.cf-card{position:absolute;top:50%;left:50%;width:60%;aspect-ratio:3/4;
  transform:translate(-50%,-50%);border-radius:14px;overflow:hidden;cursor:pointer;
  background:#0f1826;box-shadow:0 22px 46px rgba(0,0,0,.5);
  transition:left .62s cubic-bezier(.22,.61,.36,1),transform .62s cubic-bezier(.22,.61,.36,1),
    opacity .62s,filter .62s;
  will-change:left,transform}
.cf-card img{display:block;width:100%;height:100%;object-fit:cover}
.cf-card.is-cur{left:50%;transform:translate(-50%,-50%);z-index:3;opacity:1}
/* rotateY(-40deg) 的矩阵列主序 m13 = +sin40·0.333 → 左卡左缘后退；右卡取反，镜像内凹 */
.cf-card.is-l{left:10%;transform:translate(-50%,-50%) rotateY(-40deg) scale(.333);
  z-index:2;opacity:.82;filter:brightness(.72) saturate(.85)}
.cf-card.is-r{left:90%;transform:translate(-50%,-50%) rotateY(40deg) scale(.333);
  z-index:2;opacity:.82;filter:brightness(.72) saturate(.85)}
.cf-card.is-off{left:50%;transform:translate(-50%,-50%) scale(.28);z-index:1;opacity:0;pointer-events:none}
.cf-nav{position:absolute;top:50%;margin-top:-21px;width:42px;height:42px;padding:0;
  border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(14,20,38,.58);
  color:#fff;font-size:15px;cursor:pointer;z-index:4;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);transition:.2s;opacity:.78}
.cf-nav:hover{background:linear-gradient(135deg,#FF6B6B,#FF9F45);border-color:transparent;opacity:1}
.cf-prev{left:10px}
.cf-next{right:10px}
.sp-head{color:#fff;min-width:0;text-align:center}
.sp-head h1{font-size:clamp(26px,3.6vw,40px);font-weight:800;letter-spacing:1px;line-height:1.2;
  text-shadow:0 2px 18px rgba(0,0,0,.6)}
.sp-lede{margin:14px auto 0;font-size:14.5px;line-height:1.85;opacity:.93;
  max-width:760px;text-shadow:0 1px 10px rgba(0,0,0,.55)}

.sp-sec{margin-top:38px}
.sp-h2{font-size:19px;font-weight:800;color:#243043;display:flex;align-items:center;gap:10px;
  margin-bottom:16px}
.sp-h2 i{color:#FF6B6B}
.sp-story{background:#fff;border-radius:20px;padding:6px 28px 24px;
  box-shadow:0 6px 24px rgba(20,40,80,.07)}
.sp-story h3{font-size:15.5px;font-weight:800;color:#3a4a63;margin:26px 0 8px;
  padding-left:12px;border-left:4px solid #FFD93D}
.sp-story p{font-size:14.5px;line-height:2;color:#5b6879;margin-top:10px}

.sp-vtabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sp-vtab{font-size:13px;padding:9px 16px;border-radius:30px;background:#fff;border:1px solid #e6ebf2;
  color:#5b6879;cursor:pointer;transition:.2s;font-family:inherit}
.sp-vtab:hover{border-color:#FF6B6B;color:#FF6B6B}
.sp-vtab.active{background:linear-gradient(135deg,#FF6B6B,#FF9F45);color:#fff;border-color:transparent}
.sp-video-wrap{border-radius:20px;overflow:hidden;background:#000;
  box-shadow:0 10px 30px rgba(20,40,80,.16)}
.sp-video-wrap iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.sp-vnote{font-size:12.5px;color:#9aa6b5;line-height:1.85;margin-top:12px}

@media(max-width:820px){
  .sp-hero-main{padding:22px 16px 24px;gap:16px}
  .cf-wrap{perspective:1000px}          /* 高度继续由 aspect-ratio:3/2 决定 */
  .cf-nav{width:36px;height:36px;margin-top:-18px;font-size:13px}
  .cf-prev{left:6px}
  .cf-next{right:6px}
  .page-bar{padding:12px 18px}
  .page-inner{padding:20px 18px 70px}
  .sp-story{padding:4px 18px 20px}
}
</style>
</head>
<body>
<nav class="navbar">
  <div class="logo"><i class="fas fa-tv"></i><span>童年回忆</span></div>
</nav>

<div id="home">
<section class="hero">
  <div class="hero-strips" id="heroStrips"></div>
  <div class="hero-content">
    <h1 class="hero-title">童年回忆</h1>
    <p class="hero-subtitle">那些年我们一起追过的动画片主题曲</p>
  </div>
  <div class="hero-marquee" id="marquee"><div class="marquee-track" id="marqueeTrack"></div></div>
</section>

<div class="container">
  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<footer class="footer">💝 珍藏童年，回味经典 💝</footer>
</div>

<!-- ---------- 子页面（每个动画一页，同文件内切换） ---------- -->
<div class="page" id="subpage">
  <div class="page-bar">
    <button class="page-back" id="backBtn"><i class="fas fa-arrow-left"></i> 返回首页</button>
    <div class="page-crumb" id="crumb"></div>
  </div>
  <div class="page-inner">
    <header class="sp-hero">
      <div class="sp-hero-bg" id="spHeroBg"></div>
      <div class="sp-hero-mask"></div>
      <div class="sp-hero-main">
        <div class="sp-head">
          <h1 id="spTitle"></h1>
          <p class="sp-lede" id="spLede"></p>
        </div>
        <div class="cf-wrap" id="cfWrap">
          <div class="cf-inner" id="cfInner"></div>
          <button class="cf-nav cf-prev" id="cfPrev" aria-label="上一张"><i class="fas fa-chevron-left"></i></button>
          <button class="cf-nav cf-next" id="cfNext" aria-label="下一张"><i class="fas fa-chevron-right"></i></button>
        </div>
      </div>
    </header>

    <section class="sp-sec">
      <h2 class="sp-h2"><i class="fas fa-clapperboard"></i> 看原片</h2>
      <div class="sp-vtabs" id="spVtabs"></div>
      <div class="sp-video-wrap"><iframe id="spVideo" src="" allowfullscreen="true"
        scrolling="no" frameborder="0" allow="autoplay; fullscreen; encrypted-media"></iframe></div>
      <p class="sp-vnote" id="spVnote"></p>
    </section>

    <section class="sp-sec">
      <h2 class="sp-h2"><i class="fas fa-music"></i> 主题曲</h2>
      <div class="player">
        <div class="player-row">
          <button class="play-btn" id="playBtn"><i class="fas fa-pause"></i></button>
          <div>
            <div class="now-title" id="nowTitle">—</div>
            <div class="now-artist" id="nowArtist"></div>
          </div>
        </div>
        <div class="playlist" id="playlist"></div>
      </div>
    </section>

    <section class="sp-sec">
      <h2 class="sp-h2"><i class="fas fa-book-open"></i> 那些年，我们一起看过</h2>
      <article class="sp-story" id="spStory"></article>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 悬停时塞进卡片封面里的视频播放器（全站共用一个实例，不设 src 就不发请求） -->
<div id="hoverPark" hidden>
  <div class="cover-player" id="hoverPlayer">
    <iframe id="hoverFrame" src="" allowfullscreen="true" scrolling="no" frameborder="0"
      allow="autoplay; fullscreen; encrypted-media"></iframe>
  </div>

const STORY = {"p01": {"lede": "“葫芦娃，葫芦娃，一根藤上七朵花。” —— 这七个字一响，很多人脑子里会自动接上下半句，连调子都是对的。", "sections": [{"h": "守着电视的那半个钟头", "ps": ["那是个频道没几个、节目表靠记的年代。放学冲回家，书包往沙发上一扔，小板凳往电视机前一摆 —— 就为了赶上片头曲。前奏一起，屋里那几个闹腾的小孩会突然安静下来，因为谁也不想错过第一句。", "然后就到了那个名场面：小娃娃从葫芦里蹦出来，冲着山那边喊一声“爷爷——”。我们跟着学，把双手举过头顶比划葫芦，课间争论的内容永远是“大娃最厉害还是六娃最厉害”——力气派和隐身派，从来没吵出过结果。", "还有蛇精那面能看得很远的如意镜、蝎子精、替爷爷挡刀的穿山甲，以及最后一集七个娃连成一条心的那个镜头。那时候不懂什么叫“团结”，只知道心里“咚”地一下，挺解气。"]}, {"h": "它其实是被“设计”出来的", "ps": ["1985 年，上海美术电影制片厂决定做一批系列美术片。编剧杨玉良先从民间故事《十兄弟》里写出一个提纲 —— 十个各怀神通的兄弟。这个“神通 + 个性”的设定让导演胡进庆眼前一亮：他想要的不是温吞的童话，而是一组“打得响”的硬汉英雄。", "于是剧本被大改：原始故事的环境在宫廷，反派是官僚大臣；导演组把它挪到深山峻岭，反派变成蛇精和蝎子精。理由很实在 —— 既有戏，又省成本，还特别适合剪纸片这种工艺和小孩的欣赏习惯。七个娃除了衣服和头顶葫芦的颜色，长得一模一样：制作方便，孩子也分得清。"]}, {"h": "一格一格拍出来的两年", "ps": ["《葫芦兄弟》是中国第一部剪纸动画系列片，13 集，从 1986 年拍到了 1987 年。剪纸片像皮影戏：把人剪成带活动关节的纸片，在大背景上摆出一个个动作，然后一格一格拍下来。13 集，几千个场景，全靠手工摆出来。", "为了找场景，摄制组跑到浙江和江苏宜兴的溶洞里写生。在善卷洞里转了一圈之后，胡进庆拍板把反派改成蛇精和蝎子精 —— 因为洞里正好可以有宝石、翡翠、玛瑙这些好看的石头造型。", "整部片子 2000 多个镜头，平均每本约 160 个；特技镜头 500 多个，占了全片四分之一；200 多个场景里有 80 场是机关布景。导演组还用“过四关、斩三将”的节奏写故事 —— 一场戏刚让你喘口气，下一场紧张感又扑过来。这种密度，在以前的剪纸片里是没有的。"]}, {"h": "七个娃，深色皮肤、赤着脚", "ps": ["造型设计吴云初和胡进庆想做出一个“有点野”又带民族风格的形象。他们先参考了善财童子，又赶上那时美影厂引入了复印机 —— 可以先用墨线勾勒，复印后再上色、剪刻成纸偶。于是他们大胆用单线勾勒轮廓，做出一批带赛璐珞味道的造型：深色皮肤、头顶葫芦和葫芦叶、衣服开襟敞着胸腹、打着赤脚。", "据说剧组还向组外“悬赏”好点子。胡进庆的说法很直白：一部短片中如果有十七八个好噱头，冲击力和艺术质量都会有意想不到的收获 —— 这笔钱花得值。"]}, {"h": "一首歌，一台电子琴", "ps": ["全片的音乐出自作曲家吴应炬之手，而据说他只靠一台电子琴就完成了所有音乐设计。那首谁都哼得出的主题曲《葫芦娃》，吴应炬作曲、姚忠礼作词，由上海市少年宫合唱队演唱，上海电影乐团演奏。", "“叮当当咚咚当当”这段拟声词，当年没人在意它是什么，现在才发现它比歌词更容易记。很多“葫芦丝”后来干脆把这首歌设成了铃声。"]}, {"h": "后来它变成了什么", "ps": ["1988 年，《葫芦兄弟》拿下中国广播电影电视部 1986—1987 年优秀影片奖优秀美术片；之后又陆续得了童牛奖系列片奖、首届中国影视动画节目展播三等奖、埃及开罗国际儿童电影节三等奖。", "1989 到 1991 年，原班人马做了 6 集续集《葫芦小金刚》。再往后有 2008 年的电影版、2016 年的《新葫芦兄弟》，还有漫画和各种同人。美影厂动画音像制品每年卖出两千万套左右，其中《葫芦兄弟》一款就占了总量的 18%。", "2019 年 5 月 13 日，“葫芦娃之父”胡进庆去世，享年 83 岁。很多人那几天又重新看了一遍第一集 —— 才发现自己连分镜都还记得。"]}, {"h": "现在再看", "ps": ["今天回头看，它的画面不算精致，特效也不华丽，剪纸的接缝甚至看得见。但“一根藤上七朵花”讲的其实是个很朴素的事：七个人一条心，才打得过难关。当年我们只顾着喊“爷爷”，长大以后才明白那句话的分量。", "所以这个页面留下的不只是 13 集动画，还有当年那个坐在小板凳上、听到前奏就安静下来的自己。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1QgeP6DEo7", "page": 1, "label": "【葫芦娃】全2季 4K超清修复无删减（19 分 P）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV1y8411P7aK", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p02": {"lede": "“眼睛瞪得像铜铃，射出闪电般的精明。” —— 中国动画里少有的、一出场就自带悬疑片气质的警匪故事。", "sections": [{"h": "那是我们第一次看“破案”", "ps": ["《黑猫警长》和别的小时候看的动画不一样：它一集一个案子。森林里出了事，黑猫警长带着摩托车队出发，白鸽探长去侦察，证据、线索、追捕、真相 —— 一套流程走完，最后那声“啊哈”，案子结了。", "小时候最怕的不是反派，是每集结尾那个“请看下集”。而白鸽探长牺牲的那一集，大概是很多人人生里第一次为一部动画片掉眼泪；也是从那时候知道，故事里的人是会死的。"]}, {"h": "本来有第六集，但它没来", "ps": ["这部片子改编自诸志祥的童话《黑猫警长》，由上海美术电影制片厂出品，戴铁郎担任导演。1984 年先播出了前两集，一共只做了 5 集，1987 年播完。", "第 5 集的最后，照例打出了“请看下集”，然后 —— 就没有下集了。后来的说法是创作和排片都遇到了波折，片子就这么停在那里。几十年里，“为什么没有第六集”一直是国产动画最常被提起的遗憾之一。"]}, {"h": "一只耳和它的耳朵", "ps": ["反派里最出名的是一只耳 —— 名字就来自它少掉的那只耳朵，而少掉的那只，正是黑猫警长打的。这个命名方式特别“小孩”：不用记名字，看一眼就记住了。", "还有吃猫鼠、流氓、强盗，这些词都是从这部片子里第一次听说的。它其实是很正经地在讲“违法要被抓”这件事，只是讲得比教科书好看太多。"]}, {"h": "那首歌，词曲都是同一个人", "ps": ["主题歌《啊哈！黑猫警长》由蔡璐创作词曲，“啊哈，黑猫警长”这一句几乎是全国统一的童年暗号。", "配合画面的，是当年听起来非常“洋气”的电子音色和摩托车引擎声。在还靠收音机听歌的年代，这段音乐一响，就知道该坐定了。"]}, {"h": "它后来长什么样", "ps": ["1993 年美影厂出过续篇，后来又有《新黑猫警长》系列和 3D 版本，2010 年前后还有过电影。但对很多人来说，“黑猫警长”这四个字只对应那 5 集、那身白手套和那副墨镜。", "2019 年前后，“黑猫警长”重新在各种短视频和表情包里流行起来，新一代人是先认识那个“啊哈”，才回头去找动画的。"]}, {"h": "现在再看", "ps": ["重看会发现它其实很“成年”：节奏快、剪辑干脆、反派有智商，该有的牺牲一点不回避。它不是把孩子当傻子哄的那种动画。", "那支摩托车队开出去的画面，到现在还是很多人心里“执法者”这个概念的原始画面。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1zB4y1v7Jz", "page": 1, "label": "【4K修复】黑猫警长 (1984) 5集全【上美】（5 分 P）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV1qK4y1Z73a", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p03": {"lede": "一头倒骑的小毛驴，一顶缠头，一撮山羊胡 —— 一个专门替穷人收拾财主的老头。", "sections": [{"h": "他不是“英雄”，他是个聪明人", "ps": ["《阿凡提的故事》里没有打斗，也没有神通。阿凡提的全部武器，就是脑子。巴依老爷（财主）想占便宜，他就用更绕的圈套还回去；欺负穷人的规矩，他就照规矩把对方绕进去。", "小时候看得很爽：坏人被耍得团团转，还没有暴力。长大才反应过来，它其实一直在讲一个很硬的事 —— 弱者手里能用的资源，往往只剩下智慧。"]}, {"h": "这不是“编”出来的，是流传出来的", "ps": ["阿凡提（纳斯尔丁·阿凡提）是流传于中亚、西亚和我国新疆一带的民间智者形象，几百年来有很多版本的故事。1979 年起，上海美术电影制片厂把这些故事做成木偶动画，一共 13 集。", "它用的是木偶片工艺：角色是立体木偶，一场戏拍完，演员要一帧一帧地摆姿势。毛驴、集市、清真寺的穹顶、沙漠的颜色 —— 场景来自真实的风土，所以哪怕故事是夸张的，画面也没有一点“塑料味”。"]}, {"h": "小毛驴是反着骑的", "ps": ["倒骑毛驴是阿凡提最标志的动作。这个细节本身就带着态度：你们往前走，我偏要往后看；你们觉得理所当然的事，我偏要翻过来问一句。", "片头曲《人人都叫我阿凡提》几乎是“剧情预告”：唱的就是这个老头是谁、他打算干什么。"]}, {"h": "那些让人拍大腿的桥段", "ps": ["把树荫“卖”给巴依老爷（《卖树荫》）、让财主自己跳进坑里、用一句话把贪心的官司翻过来 —— 每个故事最后都会有一个漂亮的“回旋镖”，前面埋的伏笔啪地一下打回来。", "这种结构其实很像现在的短剧：设局、铺垫、反转。只是它没有一句废话，一集十几分钟，讲得干干净净。"]}, {"h": "现在再看", "ps": ["重看时最打动人的不是那些机灵，是阿凡提对穷人的那种平常态度 ——他从不居高临下，也不许诺奇迹，只是顺手帮你把被人拿走的那点东西要回来。", "在“聪明”常常被用来占便宜的今天，这部片子讲的其实是聪明应该站在哪一边。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1GHu96cEsp", "page": 1, "label": "童年经典动画片《阿凡提的故事》全集无广告、《阿凡提的故事》共14集、1卖树荫（14 分 P）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV1o441117ze", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p04": {"lede": "一部没有一句台词、只有 20 分钟的动画，把一句老话讲成了一部至今没人超越的短片。", "sections": [{"h": "一个和尚挑水吃，两个和尚抬水吃，三个和尚没水吃", "ps": ["故事极其简单：一个小和尚独自挑水，日子过得挺好；来了第二个和尚，两个人开始计较谁挑得多；再来了第三个，三个人谁都不肯动，最后水缸干了。直到老鼠打翻烛台，庙里着了火，三个人才一起下山救火。", "全片一句对白都没有。所有情绪，全靠动作、节奏和一顶一顶的帽子来演。小时候看笑，长大看冒冷汗 —— 因为它说的根本不是和尚。"]}, {"h": "它是被“算”出来的", "ps": ["《三个和尚》1980 年由上海美术电影制片厂出品，导演阿达（徐景达），编剧包蕾，改编自民间谚语。", "阿达做事是出了名的“抠细节”：人物造型被简化成几条线，颜色只用有限的几种，连节奏都按音乐来卡。据说为了让人物动得有喜剧感，动作被反复拆解重做 ——严丝合缝到你能感觉到“这里就该这样”。"]}, {"h": "头发越长，人心越散", "ps": ["片子里有个特别妙的细节：小和尚刚来时脑袋是光的，随着故事推进，三个人的头发越长越长。头发一长，人就开始懒、开始计较。", "还有那个小水桶，和三个人各背一截的扁担 ——道具本身就是台词：抬水那一段，两个人恨不得把水桶拴在自己这边的比例，比任何争吵都说明问题。"]}, {"h": "没有台词的“喜剧节奏”", "ps": ["这部片子被反复提到的，是它把喜剧和音乐卡得出奇地准。走路、打水、转身、摔倒，都踩在板眼上。所以哪怕听不懂任何一种语言，也能看懂它在演什么。", "这也是它能在国际上被接受的原因：它把“滑稽”做成了一种不需要翻译的东西。"]}, {"h": "现在再看", "ps": ["《三个和尚》拿过第 1 届中国电影金鸡奖最佳美术片奖，也在国际电影节上获过奖。40 多年过去，它还是国产短片里最常被老师放给学生看的那一部。", "它讲的道理一点都不新鲜：协作。但它难得的地方在于 —— 它没有让任何人站出来说这句话。最后水缸满了，火灭了，三个人的头又光溜溜的，故事就结束了。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1GdTTzCEDD", "page": 1, "label": "上美动画4k修复 - 三个和尚1980（30 分钟）", "note": "正片/合集，播放器左上角可切换分 P"}]}, "p05": {"lede": "它看起来是动画片，实际上是我们那几年最常见的一种“被允许看电视”的理由。", "sections": [{"h": "一边看动画，一边就学到了", "ps": ["1999 年，《蓝猫淘气三千问》开播。它打出的旗号是“科普动画”：恐龙为什么灭绝、宇宙里有什么、人体的血是怎么流的、风是怎么形成的 ——每一集都要回答一个问题。", "所以它在家里特别好通过审查：家长觉得这是学习，孩子觉得这是动画，两边都满意，于是它可以在地方台反复播、放学时段反复放。"]}, {"h": "蓝猫、淘气、菲菲、咖喱", "ps": ["主角是蓝猫，还有淘气、菲菲、咖喱这几个伙伴。故事往往从一个“十万个为什么”式的疑问开始，然后一群人（一群动物）要么穿越，要么进机器，要么直接跑去现场，把答案演给你看。", "这种“角色 + 问题 + 冒险”的模板，是当年国产电视动画最实用的一套办法：成本可控、可以无限续写、每一集都能独立看懂。"]}, {"h": "它其实是个巨型工程", "ps": ["“三千问”不是夸张 —— 蓝猫系列后来的总集数确实做到了数千集，还衍生出《太空历险记》《恐龙时代》《星际大战》等一堆子系列，以及图书、玩具、服装等周边。2000 年代中期，它几乎是中国最赚钱的动画 IP 之一。", "代价是产能：为了维持更新，制作量被拉到极限。后来这家公司也卷入了版权和经营的麻烦，蓝猫慢慢从电视上退了出去。"]}, {"h": "“地厚天高”", "ps": ["主题曲《地厚天高》是很多人的记忆锚点 ——“地有多厚，天有多高”这一问，配合片头里那几只动物往远处跑的画面，一听就回到下午五点多。", "有意思的是，很多人记得这首歌，却记不清任何一集的剧情。这大概就是“陪伴型动画”的特点：它的内容被忘掉了，但那个时间段、那种心情留了下来。"]}, {"h": "现在再看", "ps": ["重看会发现它的画质和叙事在今天确实有点简陋，但它的定位很难被替代：它是国产动画第一次把“知识”当成主线来做，而且一做就是几千集。", "对很多人来说，蓝猫不是一个角色，是那几年“写完作业就能看”的那个奖励。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1yx411V7dU", "page": 1, "label": "【合集】蓝猫淘气3000问 太空历险记（400 分 P）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV1mE41187KP", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p06": {"lede": "“白龙马，蹄朝西，驮着唐三藏跟着仨徒弟。” ——这首歌唱的是取经路，也是 1999 年那版动画片最锋利的记忆。", "sections": [{"h": "第一部长篇电视动画《西游记》", "ps": ["1999 年，央视动画部推出了 52 集动画片《西游记》，这是国内第一次把《西游记》完整地做成系列电视动画。它一播就是很多年，假期一到就能在电视上再遇到一次。", "对很多人来说，这才是他们的“第一个孙悟空”——不是六小龄童，也不是后来的各种电影版，而是一只脸上带着红心、说话干脆、打起来特别利索的猴子。"]}, {"h": "片头曲和片尾曲，两首都能背", "ps": ["片头曲《白龙马》，片尾曲《一个师傅仨徒弟》（就是那首“白龙马蹄朝西”的“兄弟版”），两首都是国民级的传唱度。当年小孩比谁唱得准，其实是比谁看得多。", "配乐里大量的民族乐器加上当时很新鲜的电子音效，把“腾云驾雾”做成了听觉上的标准答案 —— 以后再看别的西游，脑子里响的还是这一段。"]}, {"h": "52 集怎么装下一部《西游记》", "ps": ["52 集的容量，意味着它必须取舍：大闹天宫、三打白骨精、真假美猴王、火焰山这些必留，牛魔王、玉兔精这些支线也要有戏。每一集结构尽量自成一段，让你哪怕漏看两集也能接上。", "这种“单元剧 + 隐藏主线”的写法，后来成了国产长篇动画最常用的结构。"]}, {"h": "它在当年的位置", "ps": ["那几年国产电视动画正在从“短片”走向“长篇系列”。《西游记》是这一轮里做得最扎实的一部：美术偏传统、故事不魔改、节奏按电视来。", "它也因此成了一个标准：之后不管哪版西游动画出来，大家的第一反应都是“跟 99 版比，怎么样”。"]}, {"h": "现在再看", "ps": ["重看会发现它的画面比不上后来的技术，但它的“普通话标准”和“故事讲清楚”这两件事，一直没过时。它讲的是取经，其实也是四个人（加一匹马）在路上慢慢磨合成一个队伍的过程 ——小时候只看孙悟空打妖怪，长大才看见唐僧的固执、八戒的软、沙僧的沉默。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1He4y1p74h", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p07": {"lede": "“是他，是他，就是他，我们的英雄小哪吒。” ——一句歌词，几乎不用唱完，全国小孩就能接上。", "sections": [{"h": "2003 年的那条街", "ps": ["2003 年，52 集动画《哪吒传奇》在央视播出，很快成了那两年最热的一部国产动画。放学回家开电视，片头那个踩着风火轮冲出来的身影，是很多人的固定期待。", "它的故事跨度很大：从哪吒出生，一直讲到助周伐纣、封神榜上留名。中间夹着小龙女、小猪熊这些伙伴，也夹着石矶娘娘、妲己、纣王、申公豹这些反派。"]}, {"h": "孙楠唱的那首歌", "ps": ["主题曲《小哪吒》由孙楠演唱。孙楠的声音又亮又冲，配上“是他，是他，就是他”，几乎是为电视动画量身定做的“上头”。", "当年小孩的玩法是：听到这一句，赶紧跟着喊。喊完那句，才算正式开始看。"]}, {"h": "小哪吒为什么比别的“英雄”更近", "ps": ["他不是一个天生完美的神。刚出生就被当成妖怪，小时候闯祸、被误解、出走过，甚至死过一次。他的成长史里有明显的“代价”两个字 —— 这对当年看片的小孩来说，其实是很重的东西。", "小龙女和他那种不太会说话、但一直站在你这边的关系，也是很多人第一次在动画里看到“朋友”该是什么样。"]}, {"h": "一个孩子的“封神”", "ps": ["比起《西游记》的取经队伍，《哪吒传奇》更像一个人的成长线：被误解、被迫承担、然后长成一个能扛事的人。片子里那句关于命运的态度，后来在各种改编里被反复提起，而它的源头，很多人是从这一版认识的。", "能把这么大的神话体系塞进 52 集给孩子看，本身就不容易。"]}, {"h": "现在再看", "ps": ["后来的《哪吒之魔童降世》《哪吒之魔童闹海》把哪吒重新点燃了一次，但如果你是从 2003 年过来的，心里那个哪吒大概还是圆脸、有点倔、踩着一对风火轮的小子。", "“是他，是他，就是他”—— 这句歌词之所以记得牢，可能因为它本来就是一句问句的答案：谁是我们心里的英雄。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1g4411u74A", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p08": {"lede": "“我还会回来的！” —— 这句话喊了二十年，狼还在喊，羊还在跑。", "sections": [{"h": "每天下午五点半的那一群羊", "ps": ["2005 年开播的《喜羊羊与灰太狼》几乎定义了一个时代的放学时段。喜羊羊聪明，懒羊羊贪睡，美羊羊爱美，沸羊羊横冲直撞，慢羊羊走路都要拄拐，暖羊羊是所有人的大靠山。", "狼那边更有意思：灰太狼永远在造新机器、永远在被打飞，而红太狼永远举着平底锅等在家门口。小孩看的是羊，长大以后才发现，全片最惨的其实是那只狼 ——打不到羊，回家还得挨锅。"]}, {"h": "它是一台机器，转了很多年", "ps": ["这部动画出自广东原创动力，导演黄伟明。它一上马就是“长跑”的姿态：单元剧、结构清晰、几乎每集都能单独看懂。十几季、上千集，加上每年一部的贺岁大电影，让它成了中国电视上出现频率最高的动画之一。", "大量重复但有效的笑点（打飞、翻滚、锅砸），让它对“随时打开电视从中间看”的观看方式极其友好 ——这正是当年电视动画的生存方式。"]}, {"h": "主题曲比剧情更长寿", "ps": ["《别看我只是一只羊》是那种一听前奏就知道要开始了的歌。它的歌词讲的其实是“我虽然小，但我不弱”—— 当年只觉得热闹，现在听会发现它很像一句送给小孩的话。", "很多年后，这首歌被反复改编、翻唱，在各种怀旧合集里出现，播放量一直不低。"]}, {"h": "它也挨过批", "ps": ["2013 年，有儿童模仿片中情节发生意外，引发了对这部动画的公开讨论，之后片方在片中加入安全提示。这是国产少儿动画第一次大面积面对“内容责任”这个议题。", "之后这部片子的走向也在调整：从年年一部贺岁电影，到后来做起了体育、科幻等题材，主角们的世界慢慢“长大”了，而当年看它的那些孩子也已经不坐在电视机前了。"]}, {"h": "现在再看", "ps": ["重看会发现它的动画质量很朴素，笑点也很直白。但它准确地接住了那个年代的孩子：节奏快、人物一眼分得清、不用从第一集开始看也能笑出声。", "还有那句“我还会回来的”—— 现在更像一句关于童年的话：它们其实一直会回来。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV16BeB68EJn", "page": 1, "label": "【合集】喜羊羊与灰太狼之遨游神秘洋（62 分 P）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV13f4y1B7rg", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p09": {"lede": "光头强扛着电锯进森林，熊大熊二把他赶出去 ——一个追一个逃，追了十多年，追成了春节档的固定节目。", "sections": [{"h": "从“拆家”到“护林”", "ps": ["2012 年，《熊出没》在电视上开播。早期设定非常直接：光头强是伐木工，熊大熊二是森林的守卫，一方想砍树，一方不让砍，来来回回打闹。", "小孩最上瘾的就是光头强那些“发明” ——小时候看是看笑话，长大以后看，有一集他突然讲起自己想家、讲生活不容易，那一下很多人心里是咯噔的。"]}, {"h": "两首一听就想哭的歌", "ps": ["电视版的主题曲《我还有点小糊涂》唱的是“长大了才知道”。而电影《雪岭熊风》的《你从未离去》是另一条线 ——很多当年看片的小孩，是在这首歌里第一次正经地面对“告别”这件事。", "熊出没的音乐一直比它的剧情更加出圈：几首曲子至今在各种怀旧歌单里循环。"]}, {"h": "为什么它成了春节档常客", "ps": ["2013 年起，《熊出没》开始每年做一部大电影，从最早的贺岁短片一路做到技术成熟的三维动画长片，题材从森林冒险扩展到原始时代、狂野大陆、甚至时间与记忆的科幻设定。", "十几年下来，它成了中国电影市场上最稳定的动画系列之一：每年春节，总有一批父母带着孩子进影院。很多孩子是从“被带着去看”变成了“自己想去”。"]}, {"h": "光头强后来不那么坏了", "ps": ["随着系列推进，光头强从一个纯粹的“反派”变成了半个伙伴。砍树这件事被淡化了，取而代之的是一起解决问题的冒险。这个转向让系列走得更远，也让它更适合全家一起看。", "早期的暴力争议和后来的调整，其实也是国产少儿动画共同经历的一课。"]}, {"h": "现在再看", "ps": ["它讲的东西其实很朴素：森林要保住，伙伴不能丢。只是它用最吵、最闹的方式讲了很多年，吵到了现在的孩子也认得那两头熊。", "“我还有点小糊涂”—— 现在听这句，大概很多已经长大的人，会比小时候更懂它在说什么。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1M8aE67ExF", "page": 1, "label": "【熊出没探险日记】第一季 52集全 4k中字未删减（52 分 P）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV1zu4y1w7Up", "page": 1, "label": "初代片头曲《我还有点小糊涂》", "note": "主题曲片段，想听歌就切这个"}]}, "p10": {"lede": "一个戴着面罩、披着红披风的小猪，最早的设定里，他就是个想做英雄的普通人。", "sections": [{"h": "一开始，英雄是件挺狼狈的事", "ps": ["2006 年，《猪猪侠》开播。那时的猪猪侠不是超能力者：戴上自制的面罩和披风，就觉得自己是英雄了，然后一次次被现实打得灰头土脸，再爬起来。", "小时候看的是他和超人强、波比、小呆呆那帮人的打闹和比赛，长大以后回想，会发现这其实是个“普通孩子想做大事”的故事，一点也不遮掩主人公会失败。"]}, {"h": "它一直在换壳", "ps": ["《猪猪侠》是那种“活着会变形”的 IP：从最早的搞笑单元剧，到后来的竞速、深海、机甲等各种系列，主角团不断进入新设定，名字后面总是跟着一个新副标题。", "这背后是国产少儿动画的现实：一部片子要活下去，就得不断长出新题材，去接住新一代的小孩。"]}, {"h": "主题曲比人设更牢", "ps": ["《猪猪侠》的主题曲是那种“听一遍就跟着哼”的类型，配合片头里那个红披风的背影，几乎成了这部动画的身份证。", "它的画面在当年看已经很“草”，但那个“我就是要做英雄”的姿态特别清楚，所以很多年后大家还是记得那个穿披风的小猪。"]}, {"h": "现在再看", "ps": ["它的动画质量放在今天看确实谈不上精致，但它对“普通人的英雄梦”这件事的态度一直没变：先失败，再爬起来，然后再失败。", "如果你小时候看到的是打打闹闹，现在回头看，会看到一点特别实在的东西 ——英雄不是天生的，是硬着头皮做出来的。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1MBmUBBEhw", "page": 1, "label": "【超清修复】猪猪侠之五灵守卫者（52 分 P）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV1Z4411k7j3", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p11": {"lede": "一群水果练武术，还开着机甲去打擂台 ——没人解释过为什么，但当年所有人都接受了这个设定。", "sections": [{"h": "橙色的、菠萝味的、还有个爱睡觉的", "ps": ["《果宝特攻》的角色是按水果来的：橙留香（橙子）、菠萝吹雪（菠萝）、陆小果（苹果）、梨花诗……一群水果住在一个水果世界里，学武功、比门派、遇到事就把身体变成机甲。", "它是那种彻底不讲道理的动画：正剧的框架、无厘头的节奏、随时会冒出来的梗。小时候笑到拍大腿，很多年后还会突然想起某个桥段。"]}, {"h": "武侠 + 机甲 + 段子", "ps": ["这部片子由广州蓝弧文化制作，导演王巍。它把三件本来不搭的东西捏在了一起：门派、比武、师兄弟的江湖关系；一喊口号就变身的机甲；以及大量面向小孩、但成年人也能听出弦外之音的玩笑。", "更妙的是它的“谐音梗”密度：角色名字本身就是梗，这套玩法后来在国产动画里被反复模仿。"]}, {"h": "《疯狂果宝》", "ps": ["主题曲《疯狂果宝》是这部片子的另一张脸：绕口令一样的歌词、特别快的节奏，听一次很难完整唱下来，但每个人都会哼一句。", "这部片子前后做过好几季，每一季的主题曲都有版本差异，但“疯狂”两个字一直没变。"]}, {"h": "现在再看", "ps": ["它是那种“不装”的动画：不试图教育你，只想让你在下课之后笑一场。也正因为没有负担，它在很多人的记忆里特别清晰 ——你能立刻想起某个角色的声音和某句台词。", "在一堆讲道理的小孩动画里，这种纯粹好玩的东西，其实挺珍贵的。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1E5411h7Kx", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p12": {"lede": "把京剧的身段、唱腔、脸谱，放在一群猫身上，再让它变成一部打得不含糊的功夫动画。", "sections": [{"h": "白糖和那群猫", "ps": ["故事的主角叫白糖，一只不甘心当普通猫的小猫，一心想成为“京剧猫”。他在路上遇到了小青、大飞、武崧这些伙伴，一起往猫土深处走，去面对越来越大的敌人。", "“京剧猫”这个设定本身就带着责任感：它不是让猫穿上戏服卖萌，而是把京剧里的“唱、念、做、打”当作一套真正的战斗体系来用。"]}, {"h": "国产动画里少见的“考据感”", "ps": ["《京剧猫》2015 年开播，由北京璀璨星空文化制作。片子最被称道的，是它的美术与设定：每一只京剧猫的行当、配色、纹样，都能在京剧的行当和脸谱里找到来处。", "打戏也没有敷衍 —— 身段、水袖、亮相，被拆成动作设计，看得出来是认真研究过戏曲的。在国产少儿动画里，这种“愿意下本做文化考据”的作品并不多。"]}, {"h": "口碑很好，路走得很艰难", "ps": ["它在观众那里的评价一直很高，但制作方的经营状况并不好，更新一度长时间停滞，成了粉丝口中“叫好但命苦”的典型。", "这也是国产原创动画这些年反复出现的困境：作品的口碑和它能不能持续做下去，常常是两件不相关的事。"]}, {"h": "现在再看", "ps": ["它让人记住的不是“京剧”这两个字，而是它真的把京剧当成了好看的东西来做。对很多孩子来说，这是他们第一次觉得戏曲的身段“挺帅”。", "如果你当年看过，重看会发现：它的审美比记忆里还要好。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV19f1nBaE17", "page": 1, "label": "【1808+合集】京剧猫：京剧猫第三季乘风破浪（52话全）（23 分 P）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV1kx411b7qU", "page": 1, "label": "主题曲 OP/ED", "note": "主题曲片段，想听歌就切这个"}]}, "p13": {"lede": "在还没有手游的年代，很多人第一次“养宠物、打对战、做任务”，是在这个网页里。", "sections": [{"h": "放学后先去看一下我的宠物", "ps": ["洛克王国是腾讯在 2010 年上线的儿童社区游戏，电脑上打开就能玩：养精灵、做任务、和朋友比谁的宠物更强。", "对那一代小孩来说，它是“上网”这件事最早的具体形状 ——不是刷视频，而是每天去同一个地方看一眼自己的宠物。"]}, {"h": "然后它有了动画和电影", "ps": ["游戏火了之后，洛克王国从 2011 年起陆续有了动画电影和电视动画。电影版走的是奇幻冒险的路子，TV 动画则更像把游戏里的日常搬上了屏幕：新的伙伴、新的对手、新的宠物。", "主题曲《魔法时刻》是很多人对这部动画的第一印象 ——那种“打开一个世界”的调子，和游戏本身的氛围是接的。"]}, {"h": "一个 IP 的两条命", "ps": ["洛克王国的特殊性在于：它的根在游戏，动画只是它长出来的一根枝。所以对玩家来说，动画好不好看是次要的，“那个世界还在不在”才是重要的。", "这也是国产儿童 IP 的真实样貌：游戏、动画、卡片、玩具常常是一套东西，共同拼出一段童年。"]}, {"h": "现在再看", "ps": ["如今再打开它，界面老了，规则也变了，但那种“每天要回去看一眼”的心情还在。很多人对洛克王国的怀念，其实是对“上网还是一件新鲜事”的那个年代的怀念。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1iw4m1a72V", "page": 1, "label": "【合集】洛克王国大冒险 第一部（52 分 P）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV13mR2YfEsh", "page": 1, "label": "主题曲《魔法时刻》", "note": "主题曲片段，想听歌就切这个"}]}, "p14": {"lede": "一句“赛尔号，出发！”，背后是无数个放学后守在电脑前的下午。", "sections": [{"h": "收集、进化、对战", "ps": ["赛尔号是淘米网在 2009 年上线的儿童页游。玩家扮演一名赛尔，驾驶飞船去不同的星球，收服精灵、培养进化、和别人对战。", "它的核心快感特别简单：你花时间养大的那只精灵，在场上突然强得让对手没办法。那种“我的宠物赢了他的宠物”的得意，是那一代小孩共同的记忆。"]}, {"h": "从网页走到屏幕上", "ps": ["2011 年起，赛尔号开始做动画电影，2013 年推出了电视动画的第一季，之后一季接一季地做了很多年，每一季都有自己的主题曲和新的星球、新的对手。", "主角赛小息带着伙伴们满宇宙跑，这套结构和游戏是一致的：永远有下一个星球，永远有更强的精灵。"]}, {"h": "它其实是一门“生意课”", "ps": ["赛尔号和洛克王国一样，是“游戏 + 动画 + 周边”打包出售的典型。动画的作用更像广告和世界观扩写：把游戏里那只画得小小的精灵，变成有性格、有台词的角色。", "看懂这一点，也就看懂了那几年国产儿童内容的运行方式。"]}, {"h": "现在再看", "ps": ["页游时代过去了，但“赛尔号”这三个字对很多人来说不是一款游戏，而是一整段时间：开机、登录、喂食、进化、和同学比一比，然后被妈妈喊去吃饭。", "那种慢吞吞的快乐，现在很难再复刻了。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1Xs411Y7s4", "page": 1, "label": "赛尔号 第1季 雷伊传说（52 分 P）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV1mY4y1x746", "page": 1, "label": "主题曲（第一季）", "note": "主题曲片段，想听歌就切这个"}]}, "p15": {"lede": "一架红色小飞机，每天送一个包裹到不同的国家 ——对更小的一批孩子来说，这是他们的“第一张世界地图”。", "sections": [{"h": "每集都在“送快递”", "ps": ["2015 年开播的《超级飞侠》，结构简单到近乎完美：有个小朋友需要帮助，乐迪带着包裹出发，飞到那个国家，遇到问题，叫来伙伴，一起解决。", "每一集都会路过一个地方的标志性风景，说几句当地的话，然后办完事飞走。对三五岁的孩子来说，这就是一集一堂课，但一点都不像在上课。"]}, {"h": "它是国产动画“走出去”的一次成功", "ps": ["《超级飞侠》由奥飞娱乐与韩国团队联合制作，在国内播出后又发行到很多国家和地区，是那几年国产少儿动画里海外成绩相当好的一部。", "它能走出去的原因其实很朴素：“不同国家的小孩都需要被帮忙”这个设定，本身就跨语言。"]}, {"h": "“有困难，找超级飞侠”", "ps": ["主题曲那句口号，是这套片子的开关。乐迪、小爱、酷飞、多多，每架飞机有自己的性格和特长，一个人的能力不够，就叫伙伴来 ——这套“团队解决问题”的模板，比讲道理有效得多。", "它的画面干净、颜色明亮，在手机上放给小孩看也完全不糊。很多家庭的“电子安抚奶嘴”，就是这一部。"]}, {"h": "现在再看", "ps": ["它不是那种长大后会反复回味的动画，但它对某一段年龄的孩子非常重要：第一次知道世界上有很多国家，第一次知道有困难可以找人一起解决。", "如果你家里有个小孩正在看，你大概会发现，你也能跟着看完一整集。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1CHZrBaEMy", "page": 1, "label": "【超级飞侠.S5】1080P1集粤国（20 分 P）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV1k4411b7Ms", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p16": {"lede": "“巴啦啦能量 —— 沙罗沙罗 —— 小魔仙，全身变！” ——只要念得出这句咒语，你就是当年班里最酷的人。", "sections": [{"h": "真人演的魔法少女", "ps": ["《巴啦啦小魔仙》是 2008 年播出的真人魔法少女剧，由广东奥飞参与出品、在嘉佳卡通等频道播出。主角是凌美琪、凌美雪两姐妹，一个有点冒失、一个好胜，机缘巧合下得到魔法，成了“小魔仙”。", "和动画不一样，真人剧里的“变身”是那种会让人真的站起来学的：念咒、比手势、转一圈。课间操场上，谁的动作更像样，谁就有话语权。"]}, {"h": "那句咒语为什么记得那么牢", "ps": ["它的秘诀是节奏：短、押韵、有停顿，最后一下“全身变”留给你的手。所有能被孩子记住的咒语都是这个结构 ——不是靠意义，是靠节奏和动作。", "主题曲《巴啦啦小魔仙》也一样，副歌几乎是口号式的，当年会唱的人比会解题的人多得多。"]}, {"h": "从真人剧长成一个 IP", "ps": ["这一部后来并没有停在真人剧上：陆续出过多个系列的真人剧，也做出了动画版本，还有魔法棒、变身器、卡片这些周边。", "这是当年国产儿童 IP 的标配路线 ——先在电视上抓住孩子，再在玩具货架上再抓一次。"]}, {"h": "现在再看", "ps": ["回头看重看它的特效，会有点想笑：光效朴  "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV1r4411b7oK", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p21": {"lede": "“三十年河东，三十年河西”—— 不是，那是隔壁那部。这部是唐三和小舞，是史莱克七怪，是每一个周末等更新的晚上。", "sections": [{"h": "从小说到“年番”", "ps": ["《斗罗大陆》原本是唐家三少 2008 年前后开始连载的网络小说，读者体量极大。2018 年，它的动画版开播，由玄机科技制作、企鹅影视出品。", "它做了一件当年很大胆的事：不按季播，而是按周更、长期更，也就是后来大家说的“年番”。从那以后，“每周六上午等更新”成了很多人的固定日程。"]}, {"h": "魂环、魂骨和史莱克", "ps": ["这套世界观最厉害的地方是它的“升级规则”特别清楚：魂士、魂师、大魂师、魂尊、魂宗、魂王……每一级都有明确的标志，主角每突破一次，观众就知道“可以期待下一场了”。", "再配上蓝银草、昊天锤、魂骨这些设定，以及史莱克学院那段“一群怪人凑在一起”的日子，它给了观众一个特别具体的成长坐标。"]}, {"h": "张韶涵唱的那首《破茧》", "ps": ["主题曲《破茧》由张韶涵演唱。歌名和故事几乎是同一件事：主角从弱到强，靠的从来不是天生，而是被逼到墙角之后还往前走。", "这首歌能出圈，是因为它不太像“动画主题曲”，更像一首正经的励志歌 ——很多没看过动画的人也把它放进了歌单。"]}, {"h": "它改变了一件事", "ps": ["在它之前，国产动画大多是“做一季，看看反响”。《斗罗大陆》证明了周更长番在国内也能跑通，于是后面跟着出现了大量改编自网络小说的年番。", "换句话说，你现在能看到这么多“小说改成周更动画”，起点大概就在这里。"]}, {"h": "现在再看", "ps": ["重看会发现它的节奏和特效一路在进步，早期的建模和后期差别很明显 ——这其实也是国产三维动画这十几年成长的记录。", "而真正让人留下的，是那群人：唐三、小舞，还有史莱克那七个。“一起变强”这件事，永远有人爱看。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV17zBVYMEcF", "page": 1, "label": "主题曲《破茧》", "note": "主题曲片段，想听歌就切这个"}]}, "p22": {"lede": "“三十年河东，三十年河西，莫欺少年穷。” —— 这一句，几乎是那一代网文读者共同的青春注脚。", "sections": [{"h": "一部从“被嘲”开始的故事", "ps": ["《斗破苍穹》原作是天蚕土豆的网络小说，2009 年开始连载，主角萧炎是个天才跌落谷底、又一步步爬回来的少年。", "它的核心爽点非常明确：被看不起 → 咬牙变强 → 打回去。这套叙事被无数后来者模仿，而它是那个年代的模板。"]}, {"h": "动画走过一段弯路", "ps": ["2017 年，动画版第一季开播。第一季的口碑并不好，建模和人物形象被观众大量吐槽，成了一个“原著粉不认”的典型。", "但后面的几季明显在往回找：尤其从第四季和《三年之约》开始，打斗设计、人物塑造、氛围都上了一个台阶，口碑也随之翻了回来。这段经历其实很典型：国产改编动画常常是边做边学。"]}, {"h": "《少年泪》", "ps": ["第四季的片头曲《少年泪》是这部动画最出圈的一首歌。它不喊口号，反而写的是少年身上的沉和累，和“变强”这件事背后的代价。", "放在一部以“爽”著称的作品里，这首歌选得很聪明 ——它让这个故事多了一层不轻易说的东西。"]}, {"h": "现在再看", "ps": ["重看会发现它最动人的从来不是萧炎有多强，而是他愿意为一个承诺吃多少苦。药老、萧薰儿、云韵，这些人构成了他往上走的理由。", "“莫欺少年穷”这句话现在被用得很滥，但它原来的意思是：请别急着下结论。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1kK4y127Ww", "page": 1, "label": "主题曲《少年泪》", "note": "主题曲片段，想听歌就切这个"}]}, "p23": {"lede": "“月光色，女子香”—— 一首《月光》，配上刀光剑影，把秦末的江湖搬进了三维动画里。", "sections": [{"h": "把武侠做成三维动画的第一次", "ps": ["2007 年，杭州玄机科技的《秦时明月》第一部《百步飞剑》开播，导演沈乐平。它改编自温世仁的武侠小说，故事背景放在秦灭六国之后、百家争鸣的年代。", "那几年国产三维动画还很少，《秦时明月》几乎是硬着头皮把它做成的。早期画面今天看确实粗糙，但它的野心所有人都看得出来：场景要大气、打斗要有设计、台词要有古意。"]}, {"h": "一部一直在更新的长篇", "ps": ["从《百步飞剑》到《夜尽天明》《诸子百家》《万里长城》《君临天下》《沧海横流》，这个系列一季接一季地做了十几年，跨度大到它的观众是从小学看到了上班。", "荆天明、盖聂、高月、少羽、卫庄、赤练 ——这些名字构成了很多人对“国产武侠动画”的原始印象。"]}, {"h": "胡彦斌的《月光》", "ps": ["主题曲《月光》由胡彦斌演唱，这首歌几乎成了这部动画的另一个名字。它的旋律是对的：中国风的调子、克制的编曲，配上片头里那把出鞘的剑，一下就把“江湖”两个字立起来了。", "很多年后，这首歌在短视频里被重新翻红，不少新一代观众是顺着歌回来补动画的。"]}, {"h": "现在再看", "ps": ["重看会发现它的台词密度在国产动画里少见：大量关于天下、道义、选择的对话，当年听着糊里糊涂，现在反而越听越有重量。", "它讲的不是“谁最强”，而是乱世里，人怎么守住自己的道。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV17dau6BEWj", "page": 1, "label": "【秦时明月 全四季】4K超清未删减完整版（9 分 P）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV1qJ411z7z3", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p24": {"lede": "五代十国的乱世里，一边是江湖，一边是朝堂 —— 而主角是个不想当英雄的人。", "sections": [{"h": "乱世、门派、和一个“懒”的主角", "ps": ["2014 年，北京若森数字推出《画江湖之不良人》，这是《画江湖》系列的第一部。背景放在五代十国，主角李星云是李唐后裔，偏偏不愿意接那个位置。", "刚开始看，很多人是被它的打戏吸引的：节奏快、招式有设计感、镜头敢给。看到后面才发现，它真正在讲的是身不由己这四个字。"]}, {"h": "它是“越拍越好”的那一类", "ps": ["国产长篇动画里，能一季比一季好看的并不多，《不良人》是其中一个。从早期的技术粗糙，到后面几季在运镜、配乐、人物关系上的成熟，它的进步是肉眼可见的。", "到第四、第五、第六季，它已经有了一批非常忠诚的观众，讨论的重点从“画面好不好”变成了“人物走到了哪一步”。"]}, {"h": "《天下劫》", "ps": ["第六季的片头曲《天下劫》由官方团队释出，一开口就是压迫感：配合这一季的格局，把“庙堂与江湖一起翻”的气势做了出来。", "它也是那种不看动画也能单听的主题曲。"]}, {"h": "现在再看", "ps": ["这部片子最难的地方在于它敢让角色真的“变了”：有人从少年变成掌局的人，有人从伙伴变成对手。这种变化在动画里是要勇气的 ——因为观众会不舒服。", "而它的观众之所以留下来，大概就是因为这份不舒服：它讲的从来不是一个童话。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV13s4y1L7SM", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p25": {"lede": "“所有活着的人类，都是海里一条巨大的鱼。” —— 这句话一出来，就注定了它不只是一部动画。", "sections": [{"h": "十二年和一部电影", "ps": ["《大鱼海棠》2016 年上映，导演是梁旋和张春，由彼岸天文化制作。它在被看到之前，已经做了很多年 ——一个短片、一次众筹、然后是漫长的等待。", "“等了十二年”这件事，后来成了这部电影的一部分：很多观众进场的时候，带的不只是票钱，还有自己那几年的期待。"]}, {"h": "好看得没话说，也吵得厉害", "ps": ["它的美术几乎是国产动画里最“敢画”的：福建土楼、红灯笼、云海、大鱼在天空里游过去 ——每一帧都能截图当壁纸。", "但剧情是被讨论得最凶的地方。“为了救一个人，值不值得”这个问题，当年在网上吵了很久，直到今天还没有统一的答案。"]}, {"h": "周深的《大鱼》", "ps": ["主题曲《大鱼》由周深演唱。很多人是先听了这首歌，才去看这部电影的。", "它的处理方式很特别：没有把情绪往上推，而是轻轻地飘着 ——像那条鱼在云里穿过去的时候留下的痕迹。这首歌后来成了周深的代表作之一，也成了国产动画歌曲里少见的“独立出圈”样本。"]}, {"h": "现在再看", "ps": ["重看这部电影，大概会比当年更宽容一些：它的故事确实有的地方没说圆，但它想说的那种“为了一个念头不计代价”的东西，是很真诚的。", "“我们会重聚的，无论变成什么模样。” —— 这句台词，到现在还是很打人。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1VvVwz5EcT", "page": 1, "label": "大鱼海棠完整版（223 分钟）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV1yg41177nD", "page": 1, "label": "主题曲《大鱼》（周深）", "note": "主题曲片段，想听歌就切这个"}]}, "p26": {"lede": "“我偏要踏出一条自己的路。” —— 这一次，那个喊“我命由我不由天”的人，撞上了整片海。", "sections": [{"h": "一部把纪录改掉两次的电影", "ps": ["《哪吒之魔童闹海》是《哪吒之魔童降世》的续集，同样由饺子（杨宇）执导，2025 年春节档上映。它一上映就把各种票房纪录刷了个遍，让“动画电影能有多大市场”这个问题不再需要讨论。", "对更小的一批观众来说，它不是“童年回忆”——它正在发生。但坐在影厅里的很多人，是一路从第一部的“魔童”看过来的。"]}, {"h": "这一部在讲什么", "ps": ["上一部讲的是“我是谁”；这一部讲的是“我不认”。哪吒和敖丙都被推到了更大的对立面，陈塘关、龙族、阐教与截教，所有的规则都摊在桌面上。", "它的野心很大：把封神这套体系往深处推，不再只是少年打怪，而是让角色去质问规则本身。"]}, {"h": "《就是哪吒》", "ps": ["主题曲《就是哪吒》由唐汉霄演唱。这首歌要的就是燃：鼓点往前推，副歌直接顶上去，和电影里那种“明知不可为还是要上”的气势是一路的。", "它是那种从影厅出来之后还会在脑子里循环的歌。"]}, {"h": "现在再看", "ps": ["如果说第一部让人记住了“我命由我不由天”，那第二部让人记住的是：这句话说出来是要付代价的。", "中国动画用五年时间走到这里，确实值得在多年以后，被当成“我们那年看的那部片子”来回忆。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1R4dFBFE3T", "page": 1, "label": "【4K】《哪吒之魔童闹海》首发4K蓝光原盘高码（140 分钟）", "note": "正片/合集，播放器左上角可切换分 P"}, {"bvid": "BV1W5oRY3E82", "page": 1, "label": "主题曲", "note": "主题曲片段，想听歌就切这个"}]}, "p27": {"lede": "“我命由我不由天，是魔是仙，我自己说了算！” —— 2019 年，这句话响遍了整个夏天。", "sections": [{"h": "一个被改坏的“哪吒”", "ps": ["2019 年，饺子（杨宇）执导的《哪吒之魔童降世》上映。它把哪吒重新设定成一个被当成妖怪的孩子：出生就带着魔丸，所有人都说他将来要毁掉一切。", "这个设定让所有熟悉的桥段都变了味：他不是天生正义的小英雄，而是一个被偏见逼着长大的小孩。“我命由我不由天”这句台词，就是从这种处境里长出来的。"]}, {"h": "五年的工期，一群人硬做出来", "ps": ["这部电影从筹备到上映花了五年多，参与制作的团队非常庞杂，很多镜头是国内多个团队一起啃下来的。", "它最终拿了超过 》：把男主角的骨头唱出来", "ps": ["主题曲《风骨》由信演唱。这个选择很贴角色：他的声音高、亮，带一点破釜沉舟的嘶哑，唱的就是石昊那种“我不认命”的倔。", "玄幻动画的打戏段落常靠音乐推情绪。对一部以“一路打上去”为主线的长篇来说，歌能不能立住，往往决定观众记不记得住那些高光镜头。"]}, {"h": "追更这件事", "ps": ["玄幻动画的观众很大一部分是从小说过来的。他们心里早就有一幅“石昊”该有的样子，看动画其实是在核对：那一战有没有拍出来、那句话说没说对。", "《完美世界》集数多、周期长，追它的人常是一边吐槽特效一边按时点开 —— 这大概就是长篇国漫的常态：不完美，但舍不得停。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1uu4y1o7Ha", "page": 1, "label": "主题曲《风骨》（苏见信）", "note": "主题曲片段，想听歌就切这个"}]}, "p30": {"lede": "人妖相恋，一世的缘分不够，就去涂山挂一株“续缘”的红线 —— 这是《狐妖小红娘》开篇抛给观众的一个很柔软的设定。", "sections": [{"h": "一株红线，换一段来生", "ps": ["2015 年，《狐妖小红娘》动画上线，改编自庹小新的同名漫画。设定很中国：人族与妖族若曾相爱却未能相守，可以到涂山的苦情树下“续缘”，代价是交出一段记忆。", "于是每个单元故事都带着一点遗憾：这一世没走完的，下一世再遇见。很多人第一次看是被“涂山苏苏”的可爱拉住，看到后面才发现，它真正讲的是错过。"]}, {"h": "苏苏与月初", "ps": ["女主涂山苏苏是只没什么法力的小狐妖，男主白月初是承接“红线仙”任务的少年。一个憨、一个滑，凑在一起就出笑点，也出眼泪。", "“我想做一个合格的红线仙”——苏苏这句朴素的愿望，撑起了作品最动人的部分：她的认真，恰好跟姐姐涂山红红的强悍形成对照。"]}, {"h": "《梦回还》为什么出圈", "ps": ["主题曲《梦回还》由呦猫UNEKO演唱，旋律一起就有很强的画面感，是那些年被反复翻唱的国漫歌曲之一。", "歌名里的“回还”正是作品的核心：梦回去，缘回来。国漫歌曲出圈往往不靠编曲多复杂，而是它能不能替观众把说不出口的那句“我还想着”唱出来。"]}, {"h": "国漫的“感情线”样本", "ps": ["在很长一段时间里，国产动画的主角都在忙着打架、升级、拯救世界。《狐妖小红娘》把重心放在“人和妖的感情”上，其实是个不小的冒险。", "结果它成了那个时期最成功的国漫之一，也带出一条“国风 + 情感”的路线。很多年后回头看会发现，它留下的不只是几个角色，还有“国漫也能好好谈恋爱”这件事。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1kx411e7vn", "page": 1, "label": "主题曲《梦回还》", "note": "主题曲片段，想听歌就切这个"}]}, "p31": {"lede": "罗峰第一次握起拳的时候，地球已经被怪兽和外星文明围住了 —— 他要做的，是带着整个人类往上爬。", "sections": [{"h": "科幻外壳里的“苦修”", "ps": ["《吞噬星空》动画 2020 年上线，改编自我吃西红柿的同名小说。设定是混搭的：一边是外星飞船、虫族与机械族群，一边是武学境界、极限武馆与“精神念力”。", "主角罗峰出身普通家庭，从高考、训练营一路打到太空战场。它最抓人的地方不是设定多新奇，而是把“一个人拼命变强”写得非常具体 —— 汗水、伤病、被淘汰的恐惧。"]}, {"h": "从地球到宇宙", "ps": ["这部作品的节奏是阶梯式的：地球篇、宇宙篇、更远的星域篇一路往上，敌人从怪兽换成异族文明。", "这种不断换地图的结构很考验制作，但也正是长篇科幻改动画的乐趣：上一季还在争一片森林，下一季已经在谈星系归属。"]}, {"h": "《进阶》与节奏", "ps": ["主题曲《进阶》由林俊杰演唱。歌名本身就等于作品的台词：进阶，是罗峰唯一允许自己做的事。", "动画打斗段落节奏快、镜头切换密，配乐需要“顶住”画面。一首气质对的片头曲，能让观众在那几十秒里就把情绪调到“要变强”的档位。"]}, {"h": "它代表的那一波", "ps": ["2020 年前后，一波网文改科幻动画集中上线，把国产动画的技术重心进一步推向三维。", "《吞噬星空》是其中代表之一。它未必每一帧都完美，但它证明了一件事：国产三维动画撑得起足够大的世界观。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV18r421K7Sv", "page": 1, "label": "主题曲（张杰）", "note": "主题曲片段，想听歌就切这个"}]}, "p32": {"lede": "商纣王的儿子活了下来，要跟“神”算一笔账 —— 《武庚纪》把一个家喻户晓的神话，反过来讲了一遍。", "sections": [{"h": "把“封神”翻过来看", "ps": ["《武庚纪》改编自郑健和、邓志辉的漫画《封神纪》，2016 年起由玄机科技制作动画。它做了一件很有意思的事：把《封神演义》里的“正邪”重新分配。", "在这部作品里，反抗神族的人类与妖族才是主角，神话里的“神”反倒成了压迫者。武庚作为纣王之子，从被追杀的孩子，一步步走到能与“天”对峙的位置。"]}, {"h": "玄机的视觉标签", "ps": ["玄机科技的作品辨识度很高：三维建模、大场面、人物造型偏英挺，打斗讲究招式与镜头的配合。", "《武庚纪》里“天”那一方的设定尤其出彩 —— 铠甲、羽翼、神域的空间感，在当年的国漫里属于视觉上很“敢”的一档。"]}, {"h": "热血无赖", "ps": ["主题曲《热血无赖》走摇滚路子，跟作品里“反叛”的底色很合。", "武庚不是传统意义上的英雄，他有点痞、有点不计后果。“热血无赖”这四个字形容他本人，比形容场面更贴。"]}, {"h": "反派的写法", "ps": ["《武庚纪》最常被讨论的一点是反派：“天”不是纯粹的恶，他有自己的秩序和理由。", "当一部作品愿意让对手说出“我为什么这么做”，它就超出了一般打斗动画的范围。这也是它后来能持续出续集的原因之一。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1gs411v7Qi", "page": 1, "label": "主题曲《热血无赖》", "note": "主题曲片段，想听歌就切这个"}]}, "p33": {"lede": "一个选择了“骑士”这条最不划算的路的少年，和一座由骑士、刺客、魔法师共同守护的大陆。", "sections": [{"h": "唐家三少的另一种打开方式", "ps": ["《神印王座》动画改编自唐家三少的同名小说，2022 年上线。跟《斗罗大陆》的学院成长路线不同，它把重心放在“职业体系”上。", "骑士、刺客、魔法师各有组织与规矩，而主角龙皓晨选的是骑士 —— 理由不复杂：他觉得这条路最正。"]}, {"h": "龙皓晨", "ps": ["龙皓晨讨喜的地方在于“认死理”：他守规矩、重承诺，对同伴几乎不计代价。", "这样的主角在升级文里其实少见，多数人写的是机灵和算计，而他靠的是一股“我答应过”的笨劲。"]}, {"h": "《盛开》", "ps": ["主题曲《盛开》由张远演唱，走的是偏抒情、偏昂扬的调子。", "歌名跟作品主题咬得很紧：在一个讲究天赋与传承的世界里，龙皓晨要证明的是“普通人也能开花”。"]}, {"h": "国漫玄幻的产能线", "ps": ["2020 年之后，各大平台集中上线了多部玄幻网文改动画，形成了一条相当稳定的产能线。", "《神印王座》是其中比较稳的一部：不追求颠覆，但该有的打戏、成长线、情感线都齐。对追更的人来说，稳定的“好看”本身就有价值。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1z8411Z79x", "page": 1, "label": "主题曲《曙光》", "note": "主题曲片段，想听歌就切这个"}]}, "p34": {"lede": "一万年过去了，唐门成了故事里的名字，而一个从小镇走出来的少年，要把这块招牌重新挂起来。", "sections": [{"h": "把时间轴往后推一万年", "ps": ["《斗罗大陆Ⅱ绝世唐门》改编自唐家三少的同名小说，动画 2021 年上线。它没有接着唐三的故事往下写，而是把时间轴推到一万年之后。", "在这个时代，唐门已经没落，魂导器取代了传统武魂的地位，整个大陆的规则都换了一套。主角霍雨浩从偏远小镇出发，第一个目标很朴素：去史莱克学院看看。"]}, {"h": "霍雨浩的“眼睛”", "ps": ["霍雨浩的天赋集中在精神类武魂上，这让他从一开始就不是靠蛮力取胜的类型。", "他的成长线里塞满了各种“被轻视再翻身”的桥段，是唐家三少最擅长的节奏。老观众一边熟悉这套配方，一边还是会为学院的团战和魂环搭配认真算一遍。"]}, {"h": "《一梦繁唐》", "ps": ["主题曲《一梦繁唐》歌名取得很准：“繁唐”既是繁华的唐门，也是前作《斗罗大陆》留下的那个情怀。", "这首歌在很多追更的人心里，不只是片头曲，更像是一个信号 —— 只要前奏一响，就知道接下来二十分钟要跟着史莱克学院上场了。"]}, {"h": "续作这件事", "ps": ["做续作最难的是“既要像，又要不一样”。《绝世唐门》选择的方式是保留世界观和成长套路，换一整套角色和时代背景。", "对它来说，成功的标准很实际：老观众认这块牌子，新观众也能不看前作直接看懂。从更新季数来看，它做到了。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1DM4y1J73V", "page": 1, "label": "主题曲《璀璨冒险人》（周深）", "note": "主题曲片段，想听歌就切这个"}]}, "p35": {"lede": "一个资质平平的普通人，靠着不肯低头，硬是在修仙这条路上一步步逆着走。", "sections": [{"h": "“凡人流”的那口气", "ps": ["《仙逆》动画改编自耳根的同名小说，2023 年上线。它最核心的设定不在法宝与境界，而在主角王林的起点 —— 一个资质并不出众的凡人家子弟。", "修仙题材里，“天才”通常更好写：给他机缘、给他越级战斗。而王林走的是另一条路：谨慎、隐忍、把每一步都算到极致，然后再用最不讲道理的那口气顶上去。"]}, {"h": "王林这个人", "ps": ["王林的魅力在于“狠”：对敌人狠，对自己更狠。他很少热血上头，大部分时候冷静得近乎冷酷。", "但作品又给他留了一条柔软的线 —— 对亲人的执念、对承诺的坚持。正是这条线，让这个角色不至于变成一个纯粹的杀伐机器，也让“仙逆”两个字有了另一层意思：修的是仙，逆的是命。"]}, {"h": "《逆魂》", "ps": ["主题曲《逆魂》由 GAI 周延演唱，说唱与国风的混合，跟作品的“硬”非常搭。", "歌名就是角色：逆，是他必须选的姿态；魂，是他一路没丢的东西。国漫主题曲近年越来越爱找说唱歌手，原因也简单 —— 这类题材需要的是骨头，不是抒情。"]}, {"h": "追更的人在看什么", "ps": ["看《仙逆》的人，很多在意的是“还原”：名场面有没有拍出来、关键台词说没说对、境界体系有没有崩。", "这也让这类改编动画天然带着一种双向奔赴的属性 —— 制作方知道观众的期待在哪里，观众也愿意为一次准确的还原买单。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1rCAheREHH", "page": 1, "label": "片头曲《逆魂》", "note": "主题曲片段，想听歌就切这个"}]}, "p36": {"lede": "韩立资质平平，没有天降机缘，只有一样别人不肯坚持的东西：把每一步都走稳。", "sections": [{"h": "“凡人流”的开山之作", "ps": ["《凡人修仙传》动画改编自忘语的同名小说，2020 年起在 B 站播出。它的标签就是“凡人流” —— 主角不靠天赋，靠的是情报、准备，以及在关键时刻不贪。", "韩立这个名字后来变成了一个符号：谨慎、算计、每次出手前都先想好退路。很多人说，看他修的不是仙，是把一件事做到底的方法论。"]}, {"h": "为什么它适合做成动画", "ps": ["《凡人修仙传》的动画在国产三维里属于技术口碑较好的一档：人物建模细腻，动作戏有明确的招式逻辑，场景也看得出美术上花了力气。", "更关键的是它改编的取舍 —— 原作篇幅极长，动画选择把重点放在“韩立的成长节点”上，让没看过小说的观众也能顺畅跟上。"]}, {"h": "《不凡》", "ps": ["主题曲《不凡》由王铮亮演唱，气质跟作品很统一：不张扬，但压得住场。", "歌名起得也巧。韩立一辈子都在做“凡人”做的事，可正是这些不起眼的坚持，最后把他推到了“不凡”的位置上。"]}, {"h": "在 B 站的那几年", "ps": ["《凡人修仙传》是 B 站国创区最有代表性的长篇之一，围绕它的弹幕文化也很有意思 —— 观众会认真讨论战术、分析境界，甚至替角色算灵石。", "这种“看得进去”的氛围，是长篇动画最难得的东西：它把看片变成了一件需要动脑子、也值得一起聊的事。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1Cv41117hZ", "page": 1, "label": "片头曲《不凡》（王铮亮）", "note": "主题曲片段，想听歌就切这个"}]}, "p37": {"lede": "墨色山水中，一支笛子响起来 —— 那是魏无羡回来了，而有些旧账，该翻一遍了。", "sections": [{"h": "水墨国风的天花板", "ps": ["《魔道祖师》动画 2018 年上线，改编自墨香铜臭的同名小说，由视美精典制作。它当年出圈的第一原因很直白：好看。", "水墨感的背景、讲究的服化、几乎每一帧都能截图当壁纸的画面，让它成为“国风美育”式的样板。放到今天再看，那种克制而清楚的东方审美依然不过时。"]}, {"h": "魏无羡与蓝忘机", "ps": ["两个主角几乎是一对反义词：一个跳脱、口无遮拦、爱惹事；一个守礼、少言、把规矩刻在骨子里。", "作品真正动人的地方，是这两个人怎么在漫长的误会与别离之后，重新站到一起。它讲的不是少年热血，而是“我认得你，即使在所有人都不认你的时候”。"]}, {"h": "《醉梦前尘》", "ps": ["主题曲《醉梦前尘》由林志炫演唱，声线清亮昂扬，把这部作品的“旧梦”气质唱得很足。", "“前尘”两个字等于全片题眼：前尘旧事，能否放下；故人重逢，还认不认得。国漫歌曲能被记住的，往往就是这种一句话点透整部作品的能力。"]}, {"h": "它留下的东西", "ps": ["《魔道祖师》证明了国产动画在“国风审美 + 成熟配音工业”上能达到的高度，也让配音演员从幕后走到了台前。", "更重要的是它带出一条路径：改编作品不必削平原作的棱角，把风格做足，反而会被观众记住。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV17W411c72X", "page": 1, "label": "主题曲《醉梦前尘》（林志炫）", "note": "主题曲片段，想听歌就切这个"}]}, "p38": {"lede": "一个以为自己只是普通大学生的年轻人，突然被告知：你爷爷的墓被人挖了，而你，是个“异人”。", "sections": [{"h": "四川话、埋人和宝儿姐", "ps": ["《一人之下》动画 2016 年上线，改编自米二的同名漫画。它最出名的几样东西都很“不正经”：浓重的四川方言、满地乱挖的埋人桥段，以及一个台词很少却气场极强的冯宝宝。", "但正是这些不正经，把它从一堆同类作品里分了出来。它讲的是“异人”们的世界，却能让人闻到街边小面的味道。"]}, {"h": "张楚岚", "ps": ["主角张楚岚一开始是个非常“怂”的人：怕事、爱演、能躲就躲。", "这设定后来被证明是整部作品的聪明之处 —— 一个精于算计的主角，才有资格去谈“守不守底线”。他的成长不是变强，而是慢慢愿意为一些人不再躲。"]}, {"h": "八奇技与“道”", "ps": ["作品的核心悬念之一，是“八奇技”与当年那场变故的来龙去脉。它把悬念铺得很长，也让追漫画的人常年处在“下一话就揭晓”的期待里。", "而它真正的底色其实是道家那一套：什么是“道”、什么算“气”、人该怎么活着。江湖打得热闹，内核却一直在问一个安静的问题。"]}, {"h": "《无涯》与《丹歌惊鸿》", "ps": ["第二季片头曲《无涯》由醉雪演唱，那句带着点山歌劲道的唱腔，一响起就让人想到宝儿姐在田埂上走的样子。", "片中的《丹歌惊鸿》等歌曲同样是很多人收藏的国风曲目。这一系列的音乐有统一的“土味国风”气质 —— 不精致，但很真。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1w64y1M7ss", "page": 1, "label": "片头曲《出入平安》", "note": "主题曲片段，想听歌就切这个"}]}, "p39": {"lede": "七大平行宇宙每十万年连通七天 —— 就在这七天里，五个中学生被卷进了一场打了两辈子的仗。", "sections": [{"h": "一部“不像给孩子看”的儿童动画", "ps": ["《超兽武装》2011 年 4 月首播，广州蓝弧文化出品，分《仁者无敌》与《勇者无惧》上下两部，各 33 集，一共 66 集。", "它的设定放在当年非常“敢”：七大平行宇宙、十万年一次的轮回、冥王与雪皇的对立。它没有把观众当小孩哄，而是真的在问“强者该不该统治弱者”这类问题。后来它在很多盘点里被叫作“童年神作”，原因就在这儿。"]}, {"h": "五个人，五种信念", "ps": ["第一平行宇宙的中学生火麟飞、天羽、苗条俊，加上龙族的龙戬、被奴役的泰雷，以及后来加入的夜凌云、风耀、风影 —— 每个人物的立场都能自圆其说。", "最能说明它写法的一点是：冥王和雪皇都不是纯粹的坏人。一个信奉弱肉强食的秩序，一个相信爱能填满一切，两种“善”撞在一起，反而成了最大的冲突。"]}, {"h": "《超兽武装》这首歌", "ps": ["主题曲《超兽武装》由刘罡、陈洁丽演唱，王巍作词、隋晓峰与王巍作曲。男声的高亢加女声的清亮，是那个年代国产机甲动画最常见的配方，也是最有效的那种。", "“再来是千年的千年，不变是眷恋的眷恋”——副歌那句词，很多年后还能被完整地唱出来。对一部少儿动画来说，这已经是很难得的成绩。"]}, {"h": "蓝弧的那个年代", "ps": ["《超兽武装》与《百变机兽之洛洛历险记》《果宝特攻》同出蓝弧，是那几年国产三维机甲动画最有产量的一批。", "当年看它的人多半只记得“变形、合体、超兽进化”；长大后再看，才发现它留下一套挺完整的角色群像。所谓童年回忆，往往就是这么被重新读懂的。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1Qb411m7Cd", "page": 1, "label": "主题曲完整版", "note": "主题曲片段，想听歌就切这个"}]}, "p40": {"lede": "一个十一岁的电竞少年，被一道雷劈进了自己最擅长的游戏里 —— 从那天起，他成了机车族的“机战王”。", "sections": [{"h": "中国第一部变形机器人动画", "ps": ["《百变机兽之洛洛历险记》2008 年元旦首播，由蓝弧文化与广州星杰玩具联合出品，导演王巍，共 52 集。它被称为中国第一部以变形机器人为主角的大型动画片。", "设定很讨男孩喜欢：天才游戏高手洛洛最擅长玩一个叫《机战王》的三维游戏，某天雷电交加的夜里，一道闪电把他从现实拽进了游戏世界。"]}, {"h": "机车族与猛兽族", "ps": ["机兽世界分成两个阵营：性格和善的机车族，以及好斗的猛兽族。后者发现打赢对手就能夺取对方的战斗能量，于是三大战王带领军团大举进攻。", "洛洛在这里遇到了他最重要的伙伴 —— 时光之城的霹雳火，还有爱唠叨耍宝的风火轮。后来一路上又结识了力霸天、龙卷风、急先锋、冲击波、超音速。第二季的台词“合击绝技”，是当年课间模仿率最高的招数。"]}, {"h": "《诺言》：一首被记住的片尾曲", "ps": ["片头曲《机战王》气势足，但真正被反复翻出来的，往往是陈洁丽唱的片尾曲《诺言》，由王巍作词作曲、隋晓峰编曲。", "“总在梦里穿越，灿烂星光点点”——一句歌词就把那个世界的夜晚写出来了。它后来成了很多人“童年歌单”里的固定曲目。"]}, {"h": "后来的事", "ps": ["2013 年，导演王巍做了重制版《武战道》。2018 年 4 月，广州知识产权法院一审认定《武战道》侵犯《百变机兽之洛洛历险记》著作权人的权利，判令三被告共同向权利人支付著作权使用费 120 万元。", "不管后来的争议如何，对当年守着电视的人来说，记住的还是一个少年和一群机器战士，为了回一趟家而打完了整场战争。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1FZ4y1p7cg", "page": 1, "label": "主题曲《机战王》", "note": "主题曲片段，想听歌就切这个"}]}, "p41": {"lede": "“拉过勾的事情，就一定要做到。” —— 麦当要去的地方叫彩虹海，那是他爸爸消失的地方。", "sections": [{"h": "2011 年那部口碑最高的国产动画", "ps": ["《星游记》2011 年 10 月 30 日在央视少儿频道首播，共 26 集，导演曾伟京、刘北。豆瓣评分 9.6，被很多人称为那一年的国产动画巅峰。", "制作过程很不容易：工艺平台用的是 Flash，但流程完全按传统手绘走，26 集做了大约 18 个月。主创光是搭世界观就用了两个月，写故事梗概又花了半年。"]}, {"h": "彩虹海、银河眼和一个想飞的少年", "ps": ["麦当的父亲麦林曾带人飞向太空寻找“彩虹海”，却卷入黑洞全员失踪。控制银河系的“银河眼”以此为由销毁了地球上所有飞船。", "麦当不信这个结论。他拿到了“彩虹石”，遇见了外星国王咕咚，坐着一艘破飞船冲出了地球。这个开场几乎解释了整部作品的气质：不讲道理地相信，然后是拼尽全力地去。"]}, {"h": "《再飞行》：被称为“万能 OP”", "ps": ["片头曲《再飞行》由逃跑计划乐队演唱，格非作曲、刘北作词，片尾曲则是牛奶咖啡的《Next World》。", "这首歌当年在 B 站有个著名的梗：它跟《Fate/Zero》《罪恶王冠》《魔法少女小圆》等一堆日本动画的 OP 都能“神同步”。能被玩成万能片头，本身就说明它节奏和情绪有多准。"]}, {"h": "为什么大家一直在等", "ps": ["《星游记》只播了 26 集就停在那里，故事并没有讲完。此后每隔几年，都会有人问一句“星游记还出不出续集”。", "它留下的东西其实很简单：一个从头到尾都不肯放弃的少年。很多当年看它的小孩，后来是在自己最难的时候，又回去把这首歌翻出来听了一遍。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1714y1W7dN", "page": 1, "label": "主题曲《再飞行》（逃跑计划）", "note": "主题曲片段，想听歌就切这个"}]}, "p42": {"lede": "一个在民间长大的格格被接回了皇宫 —— 她不会请安、不懂规矩，却把整个宫里的气氛都带活了。", "sections": [{"h": "中国第一部“古装宫廷风少女”动画", "ps": ["《甜心格格》由深圳方块动漫出品，2011 年首播，第一季 52 集，导演彭雪梅。它被称为中国首部以“古装宫廷风少女”为题材的长篇动画片。", "故事开头有点童话：皇帝当年在民间邂逅一位女子，生下女儿；兵乱中母女失散，多年后皇帝找回了这个女儿 —— 甜丝丝。她在市井里长大，生性懒散、主意一堆，被送进尚书房学规矩，从此宫里没有一天清静。"]}, {"h": "四个人和一位大人", "ps": ["甜丝丝在尚书房认识了三个同伴：爱美又要强的班长心柔柔、从西洋回来、满口新鲜玩意儿的华伦，以及忠厚到有点迟钝的武状元白米饭。", "四个人凑在一起，就是一台永不停的“闯祸 + 收场”机器。而最头疼的是讨厌小孩的大臣王坤 —— 他的每一个奸计，最后基本都被丝丝无意间搅黄。"]}, {"h": "《快乐女孩》", "ps": ["主题曲《快乐女孩》由刘惜君演唱，秋言作词作曲、张楚弦编曲。这首歌几乎等于这部动画的身份证：轻快、明亮、一点都不装。", "它不是那种“宏大”的动画歌曲，但传唱度极高。很多年后，只要前奏响起来，人就会自动回到那个“放学回家打开电视”的傍晚。"]}, {"h": "做了五季的成长", "ps": ["从第三季起，《甜心格格》把舞台搬到了现代校园，角色换上现代服装，前两季变成了“戏中戏”。这个改动当年争议不小，但系列一路做到了第五季，共 208 集。", "它拿过金龙奖最佳系列动画奖，也拿过美猴奖提名。回头看，它其实做了件挺难得的事 —— 用最轻松的壳，讲“守规矩”和“做自己”怎么共存。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1Ge4y1y7ya", "page": 1, "label": "主题曲《快乐女孩》（刘惜君）", "note": "主题曲片段，想听歌就切这个"}]}, "p43": {"lede": "六个孩子和六颗灵龙蛋 —— 他们要在一个叫“斗龙世界”的裂缝空间里，阻止一条黑龙醒来。", "sections": [{"h": "从一颗陨石开始", "ps": ["《斗龙战士》2011 年 7 月首播，由广州百逸动漫制作，导演梁启波，改编自王虹虹的童话科幻小说，第一季 60 集。", "设定很“男孩向”：恐龙世纪的一颗陨石撞出地球，炸出了一个裂缝空间 —— 斗龙世界。那里由四大神王龙守护，黑暗之王黑亡龙即将复活；与此同时，全世界有十万个爱玩斗龙游戏的孩子莫名消失。"]}, {"h": "六个孩子，六种属性", "ps": ["六位斗龙战士各有属性与搭档：性子直爽的天乐配火属性的达力古；冷傲的欧阳零配水属性的海纳斯；千金小姐汪美含配土属性的卡布；稳重的安小达配木属性的木拉多；瘫痪但仍爱钻研的欧阳坤配金属性的丘比；文静孤僻的路子园配光属性的米拉。", "这套“属性 + 搭档 + 进化形态”的设计，正好踩在那几年玩具与动画联动的节奏上：宝贝龙进化成战斗龙、斗龙王、终极斗龙王，每一级都对应着新的战斗招式。"]}, {"h": "《斗龙战士》同名主题曲", "ps": ["主题曲也叫《斗龙战士》，由萧全演唱，收录在动画原声带里。它的气质跟作品完全一致：直接、热血、不绕弯。", "对一部以“打”为卖点的动画来说，这首歌唱的其实不只是战斗，还有那句贯穿全剧的东西 —— 伙伴之间能不能彼此信任。"]}, {"h": "一路做到六季", "ps": ["从 2011 年到 2020 年，《斗龙战士》做了六季共 270 集，还出了一部大电影《斗龙战士之星印罗盘》。", "它的主角群换过好几代：初代的六人打完黑亡龙，二代又出现了新的斗龙战士和新的星门体系。对一个童年向 IP 来说，能陪着一批孩子长到小学毕业，本身就算很成功了。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1vD4y1t72Q", "page": 1, "label": "主题曲完整版", "note": "主题曲片段，想听歌就切这个"}]}, "p44": {"lede": "七把剑，七个侠客，一句“七剑合璧” —— 这是很多人第一次在国产动画里看到“江湖”长什么样。", "sections": [{"h": "宏梦的那部“现象级”", "ps": ["《虹猫蓝兔七侠传》2006 年播出，由湖南宏梦卡通出品，第一季就有 108 集。在那个国产动画普遍十来集、几十集的年代，这个体量本身就够惊人。", "它当年的热度是“现象级”的：电视反复重播，文具店里的虹猫蓝兔贴纸卖到断货，街边小摊的塑料剑也是照着七把剑的样子做的。"]}, {"h": "七剑与七侠", "ps": ["设定非常武侠：虹猫持长虹剑、蓝兔持冰魄剑、莎丽持紫云剑、逗逗持雨花剑、大奔持奔雷剑、跳跳持青光剑、达达持旋风剑。七把剑集齐，才有“七剑合璧”。", "反派则是黑心虎一方，还有猪无戒、马三娘这些让人记得住的对手。对小孩来说，这是最好懂的正邪结构；对大人来说，它其实把“结盟”“背叛”“牺牲”这些江湖命题都摆上了台面。"]}, {"h": "《人生不过一百年》", "ps": ["主题曲《人生不过一百年》由袁接伟演唱，收录在《虹猫蓝兔七侠传 动画原声》里。", "“人生不过一百年”这句词放在一部少儿动画的片头，气质相当特别 —— 它没有一味热血，反而带点沧桑。这也是这部作品当年被讨论“是不是给大人看的”的原因之一。"]}, {"h": "回头看它留下的东西", "ps": ["《虹猫蓝兔七侠传》证明了国产动画可以有自己的武侠体系：门派、兵器、招式、江湖规矩，一样都不少。", "它也是宏梦卡通最强的一段时间。对当年守在电视机前的小孩来说，那些打斗、那些合璧、那些“侠”字，是他们对“江湖”最初的想象。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1YJ411K7T9", "page": 1, "label": "主题曲/片尾曲", "note": "主题曲片段，想听歌就切这个"}]}, "p45": {"lede": "一个五年级小学生，戴上一块手表，就能变成顶着电击装置的未来警察 —— 这个设定，当年没人能拒绝。", "sections": [{"h": "胡桃镇的小学生", "ps": ["《电击小子》2009 年在央视少儿频道首播，由奥飞娱乐出品，改编自山猫的同名漫画。系列共三部 78 集。", "主角熊小光是胡桃镇上一个普通的五年级学生，为了拿一台新游戏机，跟着家人参加电视游戏节目，结果在那幢“古怪屋”里遇到了来自未来的机器人卡比。"]}, {"h": "卡比、手表与路比", "ps": ["卡比从未来来到现代，身负重要任务，也因此引来了未来野心科学家派出的机器人路比。而小光得到了一块变身手表 —— 危急时刻按下去，就变成“电击小子”。", "变身后不仅力气大，头顶的电击装置还能发射雷霆电击光。后来卡比不断给他做新武器，从“火星大力拳”到各种新装备，是当年男生课间最常模仿的一批招式。"]}, {"h": "《电击小子》与《手足情深》", "ps": ["同名主题曲《电击小子》由何晶晶演唱，黎允文作曲、黄文广填词，电子乐的编曲加上一点中二感，是那种一听就让人坐直身子的片头曲。", "片尾曲《手足情深》走了完全相反的路线，唱的是小光和卡比的友情。一集二十来分钟，前后两首歌把“燃”和“暖”都占了。"]}, {"h": "为什么现在看还不土", "ps": ["很多当年看它的人回头看，会发现建模确实粗糙了，但打斗的动作设计、每集的节奏，依然很能打。", "它抓住的东西其实很朴素：一个普通小孩也能变身英雄。作业多、怕老师、被同学笑 —— 但戴上手表，他就是能打赢的那个。这种代入感，比满屏特效管用得多。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1BW411Q7qG", "page": 1, "label": "主题曲《电击小子》", "note": "主题曲片段，想听歌就切这个"}]}, "p46": {"lede": "棋盘只有十九路，可江流儿要走的，是从一个天才少年变成真正“大国手”的那段路。", "sections": [{"h": "把围棋拍成武侠", "ps": ["《围棋少年》2005 年在央视播出。它做了一件很聪明的事：把围棋当成武功来拍。落子有声、对局有气势、棋局能定胜负也能定生死。", "主角江流儿天赋极高，但一路都在被“赢棋”这件事折磨。他的对手里有来自日本的年轻棋手黑木，也有各怀心思的棋界前辈 —— 每一盘棋都牵着一段人事。"]}, {"h": "棋盘上的那点道理", "ps": ["这部作品真正想讲的，其实是“棋品即人品”。急于取胜的人会输，心里有算计的人也会输；而能赢下来的，往往是那个愿意先想清楚自己是谁的人。", "对当年完全不懂围棋的小孩来说，看它并不需要懂规则。只要看着棋盘上黑白交错、听着配乐，就能感到一种“静下来”的紧张感 —— 这在国产动画里相当少见。"]}, {"h": "《围棋少年》这首歌", "ps": ["主题曲《围棋少年》由姜必群演唱，旋律里有很浓的中国风，跟作品的古意很搭。", "它没有喊口号，也没有刻意煽情，反而是那种“沉稳地往前走”的调子。很多年后有人在歌单里翻到它，第一反应都是：原来这首我也会唱。"]}, {"h": "它教会小孩的一件事", "ps": ["《围棋少年》是极少数以“智力竞技”为主线的国产动画。它让很多小孩第一次知道，专注、耐心、认输之后再复盘，也是能被拍成热血的。", "这类作品后来很少再出现。所以它一直被记着 —— 不只是因为怀旧，也因为它在题材上确实开了一条不太一样的路。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1Gs41117xM", "page": 1, "label": "片头曲《围棋少年》/ 片尾曲《人生如棋》", "note": "主题曲片段，想听歌就切这个"}]}, "p47": {"lede": "“别看我小，我有雄心志气高” —— 一条小鲤鱼要跳过龙门，靠的不是力气，是那口气。", "sections": [{"h": "从“鲤鱼跳龙门”讲起", "ps": ["《小鲤鱼历险记》由中央电视台投资制作，共 52 集，2007 年 6 月在少儿频道《动画梦工场》首播。题材取自民间传说“鲤鱼跳龙门”，但剧情基本全新。", "美丽的鲤鱼湖被癞皮蛇祸害，小鲤鱼泡泡被迫离开家乡，去找“龙的力量”。一路上他结识了胆小的双面龟、傲气的阿酷和娇柔的小美美。"]}, {"h": "五片龙鳞与一场远征", "ps": ["故事的骨架很清晰：找齐金、木、水、火、土五片龙鳞，借龙鳞的力量跳龙门。泡泡一行从河湖走到高山、再走到大海，一路被癞皮蛇追杀。", "它的成长线写得很实在：泡泡不是一上来就强，他也会怕、也会犯错、也会被诱惑。真正被记住的是那句反复出现的态度 —— 就算小，也不认输。"]}, {"h": "两个版本的主题曲", "ps": ["片头曲是韩磊演唱的《小鲤鱼历险记》，由张藜作词、肖白作曲，气势很足；片尾曲则是金海心唱的《别看我小》，同样出自肖白之手，完全是从小鱼自己的视角在唱。", "“太阳照耀着每个鳞片，那是我在笑”——这句词写得特别准。片尾曲不宏大，却比片头更让人记得住。"]}, {"h": "央视动画的那几年", "ps": ["2005 到 2010 年之间，央视推出了一批像《小鲤鱼历险记》《哪吒传奇》这样的长片，撑起了国产少儿动画最稳定的一段产能。", "它们的技术不算顶尖，但故事讲得干净、价值观也正。也正是这批作品，构成了很多孩子对“国产动画”最初的印象。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV1KW411C7cg", "page": 1, "label": "片头曲《小鲤鱼》+ 片尾曲", "note": "主题曲片段，想听歌就切这个"}]}, "p48": {"lede": "“雷欧，雷欧……” —— 这一声一起，就知道又该跟着那两个小男孩去环游世界了。", "sections": [{"h": "212 集的科普长征", "ps": ["《海尔兄弟》1995 年首播，由北京红叶电脑动画公司与青岛海尔集团联合出品，一共 212 集 —— 至今仍是中国集数最长的动画片之一。", "主角是一对兄弟，跟着爷爷克鲁德和女孩詹妮一路旅行。每到一处，就会遇到新的自然现象、地理知识或历史故事。看动画顺便学知识，是它最鲜明的标签。"]}, {"h": "把“科普”做得好看", "ps": ["它的设定非常聪明：不设大反派，靠“旅行 + 疑问 + 解答”推动剧情。火山为什么会喷发、海水为什么是咸的、沙漠里的绿洲从哪来 —— 问题本身就是钩子。", "这也是为什么很多当年的小孩，现在还能说出几个从这部动画里第一次知道的知识点。它把学习做成了冒险，而不是作业。"]}, {"h": "《雷欧之歌》", "ps": ["主题曲《雷欧之歌》是国产动画歌曲里辨识度最高的一批之一。旋律简单、词也简单，但传唱度极广，几乎是“一响起就有人接”的那种。", "“雷欧”在片中是与自然、与探险相关的意象。这首歌后来在各种怀旧歌单里被反复翻出，也是因为它足够“无门槛”——谁都能跟着哼。"]}, {"h": "一部被低估的作品", "ps": ["《海尔兄弟》常被当成“企业做的广告片”，但它其实是中国最早成体系做科普动画的项目之一，制作规格在当年并不低。", "它让一代人记住了两件事：知识是有趣的，世界是值得走出去看的。这在今天看来依然不过时。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV143411H7vS", "page": 1, "label": "主题曲《雷欧之歌》", "note": "主题曲片段，想听歌就切这个"}]}, "p49": {"lede": "“舒克舒克舒克，开飞机的舒克；贝塔贝塔贝塔，开坦克的贝塔。” —— 这首歌，几乎不用教就会唱。", "sections": [{"h": "两只不愿当“小偷”的老鼠", "ps": ["《舒克和贝塔》1989 年由上海美术电影制片厂推出，共 13 集，改编自郑渊洁的童话。", "故事的开头很有意思：舒克是一只小老鼠，可它不愿意接受“老鼠就是小偷”这个天生的名声。它学会开飞机，靠送东西、做好事来证明自己。贝塔也一样 —— 它开的是坦克。"]}, {"h": "上美影的最后一段黄金期", "ps": ["这部片子诞生在上美影一个特殊的节点：老一代创作者还在，新的题材又开始出现。它的美术风格干净利落，动作设计一看就是手工一帧一帧摆出来的。", "两只老鼠一起飞、一起打、一起挨饿、一起结伴去远方 —— 这种“两个性格完全不同的人非要做朋友”的关系，是它最动人的部分。"]}, {"h": "那首人人会唱的主题曲", "ps": ["同名主题曲《舒克和贝塔》几乎是国产动画歌曲里辨识度最高的一首。词简单到不能再简单，却一句就把两个主角全介绍完了。", "后来 2019 年出的三维新版《舒克贝塔》也沿用了这个 IP，可对很多人来说，脑子里那两只老鼠永远是上美影笔下的样子。"]}, {"h": "它其 厂推出，是那一代观众记忆里分量很重的一部国产动画电影。", "它讲的是老故事：三圣母与凡人相恋被压在山下，儿子沉香长大成人，拜师学艺，最后劈山救母。可它的做法是新的 —— 完整的院线规格、明星配音、流行歌手演唱主题歌，全套按电影工业的玩法走。"]}, {"h": "三首歌，一个时代", "ps": ["这部电影最有影响力的其实是音乐：刘欢的《天地在我心》、李玟的《想你的365天》、张信哲的《爱就一个字》。", "三首歌当年几乎在每条街都在放，也让国产动画第一次拥有了“大歌”。很多人是先听过这几首歌，才回头去看电影的。"]}, {"h": "孙悟空当了师父", "ps": ["剧情里最讨喜的一笔，是给沉香安排了一位师父 —— 孙悟空。它把《西游记》和“劈山救母”两个民间故事接在了一起，也让整部片子的节奏有了一个会闹、会骂人、又真心护徒弟的长辈。", "配乐、配音、作画在当年都属于国产动画里最舍得下本钱的一档。它的出现，让很多人第一次觉得国产动画电影也可以“去电影院看”。"]}, {"h": "它留下的位置", "ps": ["在国产动画电影的谱系里，《宝莲灯》是一个分界点：它之前，动画多是电视短片或美术片；它之后，才慢慢有了“动画电影”这个概念。", "今天回头看，它的技术已经不算先进，但那三首歌、那句“天地在我心”，仍然稳稳地站在一代人的记忆里。"]}], "video_note": "视频来自哔哩哔哩，版权归原上传者与权利人所有，这里仅作嵌入引用。需要联网播放；若播放器提示“进入哔哩哔哩观看更高清”，点击即可跳转原页面。", "videos": [{"bvid": "BV16U4y1o7Ls", "page": 1, "label": "主题曲《不灭的心》（孙楠）", "note": "主题曲片段，想听歌就切这个"}]}};                 // id -> 子页面内容（讲解 + 视频源）
